<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRU · Manual interactivo</title>
<meta name="description" content="Recorrido guiado del bloque quirúrgico del HRU: el alta de cada integrante, sus portales, una cirugía programada con el QR del paciente, una urgencia, las estadísticas, la copa de oro, incidencias y reclamos.">
<style>
/* Rediseño 16-10-2026: un escenario con pantallas simuladas y un relato al
   lado. Nada avanza solo: en cada paso se marca qué tocar, y al tocarlo se ve
   el efecto en todas las pantallas a la vez (por ejemplo, el teléfono del
   paciente cambia apenas Admisión autoriza). Todo es de ejemplo. */
:root {
  --bg: #f2f5fa; --bg2: #ffffff; --ink: #0f1a2e; --mut: #5b687e; --line: #dfe5ee; --soft: #edf1f7;
  --scr: #f7f9fc; --scr2: #ffffff; --marco: #0f172a;
  --acento: #0f766e; --ok: #15803d; --mal: #dc2626; --ama: #b45309;
  --cir: #2563eb; --anest: #7c3aed; --jefa: #b45309; --enf: #0d9488; --inst: #db2777; --adm: #ea580c; --jef: #be123c; --pac: #0891b2; --tab: #475569;
  --sh: 0 1px 2px rgba(15,26,46,.06), 0 14px 34px -20px rgba(15,26,46,.40);
  --au1: rgba(37,99,235,.13); --au2: rgba(13,148,136,.12); --au3: rgba(219,39,119,.08);
  --r: 18px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1120; --bg2: #121a2c; --ink: #e7ecf4; --mut: #97a3b6; --line: #24304a; --soft: #182238;
  --scr: #0f1728; --scr2: #162036; --marco: #020617;
  --acento: #2dd4bf; --ok: #4ade80; --mal: #f87171; --ama: #fbbf24;
  --cir: #60a5fa; --anest: #a78bfa; --jefa: #f59e0b; --enf: #2dd4bf; --inst: #f472b6; --adm: #fb923c; --jef: #fb7185; --pac: #22d3ee; --tab: #94a3b8;
  --sh: 0 1px 2px rgba(0,0,0,.35), 0 16px 36px -18px rgba(0,0,0,.8);
  --au1: rgba(96,165,250,.12); --au2: rgba(45,212,191,.10); --au3: rgba(244,114,182,.07); } }
:root[data-theme="dark"] {
  --bg: #0b1120; --bg2: #121a2c; --ink: #e7ecf4; --mut: #97a3b6; --line: #24304a; --soft: #182238;
  --scr: #0f1728; --scr2: #162036; --marco: #020617;
  --acento: #2dd4bf; --ok: #4ade80; --mal: #f87171; --ama: #fbbf24;
  --cir: #60a5fa; --anest: #a78bfa; --jefa: #f59e0b; --enf: #2dd4bf; --inst: #f472b6; --adm: #fb923c; --jef: #fb7185; --pac: #22d3ee; --tab: #94a3b8;
  --sh: 0 1px 2px rgba(0,0,0,.35), 0 16px 36px -18px rgba(0,0,0,.8);
  --au1: rgba(96,165,250,.12); --au2: rgba(45,212,191,.10); --au3: rgba(244,114,182,.07); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { min-height: 100vh; overflow-x: hidden; line-height: 1.45;
  background-image: radial-gradient(900px 500px at 8% -10%, var(--au1), transparent 60%), radial-gradient(800px 500px at 100% 0%, var(--au2), transparent 60%), radial-gradient(700px 600px at 50% 110%, var(--au3), transparent 60%);
  background-attachment: fixed; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: not-allowed; }
#app { max-width: 1320px; margin: 0 auto; padding: 12px 16px 60px; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: 8px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px;
  background: color-mix(in srgb, var(--bg2) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); box-shadow: var(--sh); }
.marca { display: flex; align-items: center; gap: 9px; font-weight: 800; min-width: 0; }
.marca > i { font-style: normal; width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--acento), var(--cir)); color: #fff; font-size: 1.05rem; }
.marca b { display: block; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; }
.marca small { display: block; color: var(--mut); font-weight: 600; font-size: .7rem; white-space: nowrap; }
.prog { flex: 1; min-width: 40px; height: 8px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--cir), var(--anest), var(--enf), var(--inst)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.tb { border: 1px solid var(--line); background: var(--soft); border-radius: 11px; height: 36px; min-width: 36px; padding: 0 10px; font-weight: 700; font-size: .82rem; white-space: nowrap; }
.tb.pri { background: var(--acento); border-color: transparent; color: #fff; }
:root[data-theme="dark"] .tb.pri { color: #04201c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tb.pri { color: #04201c; } }
.mapa-btn, .foco-btn, .corto { display: none; }

/* ---------- cuerpo: mapa + escena ---------- */
.cuerpo { display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 18px; margin-top: 16px; align-items: start; }
.mapa { position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; padding: 12px; border-radius: var(--r); background: color-mix(in srgb, var(--bg2) 90%, transparent); border: 1px solid var(--line); box-shadow: var(--sh); scrollbar-width: thin; }
.mapa h3 { margin: 2px 4px 10px; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
.acto { margin-bottom: 10px; }
.acto-h { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 6px 6px; border-radius: 10px; font-weight: 800; font-size: .86rem; }
.acto-h:hover { background: var(--soft); }
.acto-h i { font-style: normal; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); flex: none; }
.acto-h small { margin-left: auto; color: var(--mut); font-weight: 700; font-size: .7rem; }
.acto.on .acto-h i { background: color-mix(in srgb, var(--acento) 18%, var(--bg2)); border-color: var(--acento); }
.escs { list-style: none; margin: 2px 0 0 19px; padding: 0 0 0 12px; border-left: 2px solid var(--line); }
.escs button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 8px; font-size: .8rem; color: var(--mut); font-weight: 600; }
.escs button:hover { background: var(--soft); color: var(--ink); }
.escs button span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: .6rem; }
.escs button.ok { color: var(--ink); } .escs button.ok span { background: var(--ok); border-color: var(--ok); color: #fff; }
.escs button.act { color: var(--ink); font-weight: 800; background: color-mix(in srgb, var(--acento) 10%, transparent); }
.escs button.act span { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 25%, transparent); }
.velo { display: none; }

.escena { min-width: 0; }
.relato { position: relative; padding: 16px 18px; border-radius: var(--r); background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--sh); overflow: hidden; animation: entra .35s ease both; }
.relato::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--k, var(--acento)); }
.rel-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .74rem; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.rel-top .chip { background: color-mix(in srgb, var(--k, var(--acento)) 14%, transparent); color: var(--k, var(--acento)); padding: 3px 9px; border-radius: 99px; }
.relato h1 { font-size: clamp(1.2rem, 2vw, 1.5rem); line-height: 1.2; letter-spacing: -.02em; margin: 8px 0 6px; }
.quien { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; font-weight: 700; margin-bottom: 6px; }
.quien small { color: var(--mut); font-weight: 600; }
.relato p { margin: 6px 0; color: var(--ink); font-size: .95rem; max-width: 74ch; }
.go { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--k, var(--acento)) 9%, var(--soft)); border: 1px dashed color-mix(in srgb, var(--k, var(--acento)) 45%, var(--line)); font-weight: 700; font-size: .9rem; }
.go .dedo { font-size: 1.3rem; animation: dedo 1.4s ease-in-out infinite; }
@keyframes dedo { 50% { transform: translateY(-4px) rotate(-8deg); } }
.nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.nav .tb { height: 34px; }
.nav .esp { flex: 1; }
.atajos { color: var(--mut); font-size: .72rem; align-self: center; }

/* riel del caso (en qué está la cirugía) */
.riel { display: flex; margin: 14px 0 0; padding: 12px 10px 10px; border-radius: var(--r); background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--sh); overflow-x: auto; scrollbar-width: thin; }
.est { flex: 1 0 74px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; font-size: .68rem; font-weight: 700; color: var(--mut); text-align: center; line-height: 1.15; }
.est::before { content: ''; position: absolute; top: 11px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.est:first-child::before { display: none; }
.est i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); border: 2px solid var(--line); z-index: 1; font-size: .66rem; }
.est.ok { color: var(--ink); } .est.ok i { background: var(--ok); border-color: var(--ok); color: #fff; } .est.ok::before { background: var(--ok); }
.est.act { color: var(--ink); } .est.act i { border-color: var(--acento); background: var(--bg2); animation: latido 1.6s infinite; }
.est.dif i { background: color-mix(in srgb, var(--ama) 18%, var(--bg2)); border-color: var(--ama); color: var(--ama); }
.est.dif { color: var(--ama); }

/* ---------- escenario: pantallas simuladas ---------- */
.escenario { display: flex; gap: 22px; align-items: flex-start; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.dev { flex: 1 1 340px; max-width: 440px; min-width: 0; border-radius: 34px; padding: 9px; background: var(--marco); box-shadow: 0 30px 60px -30px rgba(2,6,23,.55), 0 0 0 1px rgba(255,255,255,.06) inset; position: relative; animation: entra .45s cubic-bezier(.2,.8,.2,1) both; }
.dev.lado { flex: 0 1 290px; min-width: 250px; animation-delay: .08s; }
@media (max-width: 640px) { .dev, .dev.lado { flex: 1 1 100%; min-width: 0; } .dev.lado { max-width: 360px; } }
@keyframes entra { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.dev-in { border-radius: 26px; overflow: hidden; background: var(--scr); }
.dev-st { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 4px; font-size: .72rem; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.isla { width: 84px; height: 20px; border-radius: 99px; background: var(--marco); }
.dev-who { display: flex; align-items: center; gap: 9px; padding: 8px 12px 10px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--k) 12%, var(--scr2)), var(--scr2)); }
.dev-who > div { min-width: 0; }
.dev-who b { display: block; font-size: .84rem; line-height: 1.15; }
.dev-who small { color: var(--mut); font-size: .7rem; font-weight: 600; }
.dev-who .app { margin-left: auto; font-size: .6rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.dev.lado .app { display: none; }
.scr { position: relative; height: 520px; overflow: auto; padding: 12px 12px 34px; scrollbar-width: thin; }
.scr > * { animation: sube .4s ease both; }
.scr > *:nth-child(2) { animation-delay: .05s; } .scr > *:nth-child(3) { animation-delay: .1s; } .scr > *:nth-child(4) { animation-delay: .15s; } .scr > *:nth-child(5) { animation-delay: .2s; }
@keyframes sube { from { opacity: 0; transform: translateY(8px); } }
.av { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; background: color-mix(in srgb, var(--k) 18%, var(--scr2)); border: 2px solid var(--k); }

/* piezas de las pantallas */
.s-h { display: flex; align-items: flex-start; gap: 8px; margin: 2px 2px 10px; }
.s-h b { display: block; font-size: 1rem; letter-spacing: -.01em; }
.s-h small { display: block; color: var(--mut); font-size: .74rem; }
.s-card { background: var(--scr2); border: 1px solid var(--line); border-radius: 14px; padding: 11px; margin-bottom: 10px; }
.s-card.k { border-color: color-mix(in srgb, var(--k) 40%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--k) 9%, var(--scr2)), var(--scr2) 70%); }
.s-card h4 { margin: 0 0 4px; font-size: .9rem; }
.s-card p { margin: 3px 0; font-size: .8rem; color: var(--mut); }
.nota { font-size: .72rem; color: var(--mut); margin: 4px 2px; }
.tag { display: inline-block; font-size: .64rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--k, var(--acento)) 15%, transparent); color: var(--k, var(--acento)); white-space: nowrap; }
.tag.ok { --k: var(--ok); } .tag.mal { --k: var(--mal); } .tag.ama { --k: var(--ama); }
.b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: .84rem; color: #fff; background: var(--k, var(--acento)); width: 100%; margin-top: 6px; transition: transform .15s, filter .2s; }
.b:hover { filter: brightness(1.07); } .b:active { transform: scale(.98); }
.b.sec { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.b.ok { --k: var(--ok); } .b.mal { --k: var(--mal); }
.b.chico { width: auto; padding: 7px 11px; font-size: .76rem; margin: 0; flex: none; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.campo { background: var(--scr2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; min-width: 0; }
.campo.full { grid-column: 1 / -1; }
.campo small { display: block; font-size: .64rem; color: var(--mut); font-weight: 700; }
.campo span { display: block; font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.campo.esc span { width: 0; animation: escribe 1s steps(24) forwards; }
@keyframes escribe { to { width: 100%; } }
.paso-n { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: .8rem; margin: 10px 2px 6px; }
.paso-n span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; background: var(--acento); color: #fff; }
.paso-n.off { opacity: .4; }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 11px; background: var(--soft); border: 1px solid var(--line); font-size: .78rem; font-weight: 800; text-align: center; }
.seg span { padding: 7px; border-radius: 9px; color: var(--mut); } .seg span.on { background: var(--scr2); color: var(--ink); box-shadow: var(--sh); }
.funcs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.func { text-align: left; border: 1.5px solid var(--line); background: var(--scr2); border-radius: 12px; padding: 8px 9px; display: grid; grid-template-columns: auto 1fr; column-gap: 7px; align-items: center; min-width: 0; }
.func i { font-style: normal; grid-row: span 2; font-size: 1.2rem; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 14%, transparent); }
.func b { font-size: .76rem; line-height: 1.1; } .func small { font-size: .66rem; color: var(--mut); }
.func.on { border-color: var(--k); background: color-mix(in srgb, var(--k) 9%, var(--scr2)); }
.func.apag { opacity: .45; }
.reqs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.reqs span { font-size: .68rem; font-weight: 700; padding: 3px 7px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); }
.reqs span.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok); }
.fila { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .8rem; }
.fila:last-child { border-bottom: 0; }
.fila .esp { flex: 1; min-width: 0; }
.fila b { display: block; } .fila small { color: var(--mut); font-size: .7rem; }
.ptabs { display: flex; gap: 4px; padding: 3px; border-radius: 11px; background: var(--soft); border: 1px solid var(--line); margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.ptabs span { flex: none; padding: 6px 10px; border-radius: 8px; font-size: .74rem; font-weight: 700; color: var(--mut); }
.ptabs span.on { background: var(--scr2); color: var(--ink); box-shadow: var(--sh); }
.primero { position: relative; padding: 14px; border-radius: 16px; color: #fff; background: linear-gradient(135deg, var(--k), color-mix(in srgb, var(--k) 55%, #0f172a)); box-shadow: 0 14px 30px -18px var(--k); }
.primero .tag { background: rgba(255,255,255,.2); color: #fff; }
.primero h4 { margin: 8px 0 4px; font-size: 1.05rem; }
.primero p { margin: 0 0 6px; font-size: .8rem; opacity: .92; }
.primero .b { background: #fff; color: #0f172a; }
.wid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.w { position: relative; background: var(--scr2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
.w .n { position: absolute; top: -7px; left: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--k); color: #fff; font-size: .66rem; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--scr); }
.w i { font-style: normal; font-size: 1.1rem; }
.w b { display: block; font-size: .76rem; margin-top: 3px; line-height: 1.15; }
.w em { font-style: normal; font-weight: 800; font-size: 1.15rem; color: var(--k); display: block; }
.w small { display: block; color: var(--mut); font-size: .66rem; line-height: 1.25; margin-top: 2px; }
.flujo { list-style: none; margin: 4px 0 8px; padding: 0; position: relative; }
.flujo::before { content: ''; position: absolute; left: 13px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(var(--k), color-mix(in srgb, var(--k) 20%, transparent)); }
.flujo li { position: relative; display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: .8rem; animation: sube .4s ease both; }
.flujo li b { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--scr2); border: 2px solid var(--k); color: var(--k); font-size: .76rem; z-index: 1; }
.flujo li span { padding-top: 4px; }
.borroso { filter: blur(2px); opacity: .45; pointer-events: none; margin-top: 12px; }
.hecho-mini { display: flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; padding: 8px 10px; border-radius: 11px; background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); margin-bottom: 10px; }
.lvq { list-style: none; margin: 0; padding: 0; }
.lvq li { display: flex; gap: 8px; align-items: center; font-size: .78rem; padding: 5px 0; }
.lvq li i { font-style: normal; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: var(--ok); color: #fff; font-size: .62rem; flex: none; animation: tilde .3s ease both; }
.lvq li:nth-child(2) i { animation-delay: .12s; } .lvq li:nth-child(3) i { animation-delay: .24s; } .lvq li:nth-child(4) i { animation-delay: .36s; } .lvq li:nth-child(5) i { animation-delay: .48s; } .lvq li:nth-child(6) i { animation-delay: .6s; }
@keyframes tilde { from { transform: scale(0); } }
.firmas { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 2px; }
.firmas span { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 800; padding: 4px 8px; border-radius: 99px; border: 1.5px solid var(--k); color: var(--k); background: color-mix(in srgb, var(--k) 8%, transparent); }
.cont { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cont div { background: var(--scr2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
.cont small { display: block; color: var(--mut); font-size: .7rem; font-weight: 700; }
.cont b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.tabla { width: 100%; border-collapse: collapse; font-size: .78rem; }
.tabla th, .tabla td { padding: 6px 5px; border-bottom: 1px solid var(--line); text-align: center; }
.tabla th:first-child, .tabla td:first-child { text-align: left; }
.tabla td.ok { color: var(--ok); font-weight: 800; }
.ald .fila span { display: flex; gap: 4px; }
.ald .fila span i { font-style: normal; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: .72rem; font-weight: 800; background: var(--soft); border: 1px solid var(--line); color: var(--mut); }
.ald .fila span i.on { background: var(--k); color: #fff; border-color: transparent; }
.total { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: .84rem; padding: 8px 10px; border-radius: 11px; background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); margin-top: 6px; }
.tiempos { list-style: none; margin: 6px 0 0; padding: 0; }
.tiempos li { display: flex; justify-content: space-between; font-size: .78rem; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.tiempos li b { font-variant-numeric: tabular-nums; }
.inicio { display: grid; place-items: center; padding: 18px 0 6px; }
.inicio button { width: 150px; height: 150px; border-radius: 50%; border: 0; color: #fff; font-weight: 800; font-size: 1rem; background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--k) 70%, #fff), var(--k)); box-shadow: 0 0 0 10px color-mix(in srgb, var(--k) 15%, transparent), 0 20px 40px -18px var(--k); }
.inicio button small { display: block; font-weight: 600; font-size: .72rem; opacity: .9; }
.alerta { padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--mal) 12%, var(--scr2)); border: 1.5px solid var(--mal); animation: titila 1.8s ease-in-out infinite; }
@keyframes titila { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--mal) 18%, transparent); } }
.elige { display: grid; gap: 10px; }
.elige button { text-align: left; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; background: var(--scr2); }
.elige button b { display: block; font-size: .95rem; margin: 4px 0 2px; }
.elige button small { color: var(--mut); font-size: .76rem; }
.elige button span { font-size: 1.6rem; }
.compara { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compara div { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; font-size: .74rem; background: var(--scr2); }
.compara div.on { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 20%, transparent); }
.compara b { display: block; font-size: .82rem; margin-bottom: 4px; }
.compara ol { margin: 0; padding-left: 16px; } .compara li { margin: 2px 0; }

/* teléfono del paciente */
.qr { width: 150px; height: 150px; margin: 6px auto; display: block; background: #fff; border-radius: 10px; padding: 6px; }
.pase { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--scr2); }
.pase-top { padding: 10px 12px; color: #fff; background: linear-gradient(135deg, var(--pac), var(--cir)); }
.pase-top b { display: block; font-size: .95rem; } .pase-top small { opacity: .9; font-size: .72rem; }
.pase-cuerpo { padding: 10px 12px; text-align: center; font-size: .74rem; color: var(--mut); }
.pase-cuerpo strong { display: block; color: var(--ink); font-size: .9rem; letter-spacing: .12em; }
.camara { position: relative; height: 250px; border-radius: 18px; background: linear-gradient(160deg, #1e293b, #0f172a); display: grid; place-items: center; overflow: hidden; }
.camara::before { content: ''; width: 150px; height: 150px; border-radius: 14px; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 0 0 999px rgba(0,0,0,.25); }
.camara::after { content: ''; position: absolute; left: 50%; width: 150px; margin-left: -75px; height: 2px; background: #22d3ee; box-shadow: 0 0 12px #22d3ee; animation: barre 2s ease-in-out infinite; }
@keyframes barre { 0%, 100% { top: calc(50% - 70px); } 50% { top: calc(50% + 70px); } }
.camara span { position: absolute; bottom: 10px; color: #fff; font-size: .72rem; font-weight: 700; }
.pac-hola { padding: 12px; border-radius: 16px; color: #fff; background: linear-gradient(135deg, var(--pac), color-mix(in srgb, var(--pac) 40%, #0f172a)); margin-bottom: 10px; }
.pac-hola b { display: block; font-size: 1.05rem; } .pac-hola small { opacity: .9; font-size: .72rem; display: block; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.tl li { position: relative; display: flex; gap: 10px; padding: 5px 0; font-size: .78rem; }
.tl li i { font-style: normal; width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: .66rem; background: var(--scr2); border: 2px solid var(--line); z-index: 1; color: var(--mut); }
.tl li b { display: block; } .tl li small { color: var(--mut); font-size: .68rem; }
.tl li.ok i { background: var(--ok); border-color: var(--ok); color: #fff; }
.tl li.act i { border-color: var(--pac); color: var(--pac); animation: latidoPac 1.6s infinite; }
.tl li.act b { color: var(--pac); }
@keyframes latidoPac { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--pac) 22%, transparent); } }
.vivo { display: flex; align-items: center; gap: 6px; font-size: .68rem; color: var(--mut); margin-top: 8px; }
.vivo::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: parpadea 1.4s infinite; }
@keyframes parpadea { 50% { opacity: .3; } }
.candado { text-align: center; padding: 30px 10px; }
.candado div { font-size: 3rem; }
.candado b { display: block; font-size: 1rem; margin: 8px 0 4px; }
.candado p { color: var(--mut); font-size: .78rem; margin: 0 0 6px; }
.vacio { text-align: center; padding: 60px 14px; color: var(--mut); font-size: .8rem; }
.vacio div { font-size: 2.6rem; opacity: .6; }

/* estadísticas, copa, incidencias, reclamos */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.kpi { border-radius: 14px; padding: 10px; background: var(--scr2); border: 1px solid var(--line); }
.kpi b { display: block; font-size: 1.35rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--k); }
.kpi small { color: var(--mut); font-size: .68rem; font-weight: 700; }
.barras { display: grid; gap: 6px; }
.barras div { display: grid; grid-template-columns: 96px 1fr 26px; gap: 6px; align-items: center; font-size: .7rem; font-weight: 700; }
.barras i { display: block; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--cir), var(--enf)); transform-origin: left; animation: crece .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes crece { from { transform: scaleX(0); } }
.barras span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mut); }
.semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: .62rem; color: var(--mut); font-weight: 700; }
.semana div { display: flex; flex-direction: column-reverse; gap: 2px; align-items: center; min-height: 64px; }
.semana i { width: 12px; height: 7px; border-radius: 3px; background: var(--enf); opacity: .85; }
.semana i.u { background: var(--mal); }
.podio { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 6px; align-items: end; text-align: center; margin: 6px 0 10px; }
.podio div { border-radius: 14px 14px 6px 6px; padding: 8px 4px; background: var(--scr2); border: 1px solid var(--line); font-size: .7rem; }
.podio div b { display: block; font-size: .74rem; line-height: 1.15; }
.podio div em { font-style: normal; font-size: 1.2rem; font-weight: 800; display: block; }
.podio .p1 { padding-top: 16px; background: linear-gradient(180deg, color-mix(in srgb, #f59e0b 25%, var(--scr2)), var(--scr2)); border-color: #f59e0b; }
.copa { font-size: 4.2rem; text-align: center; animation: copa 2.4s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(245,158,11,.45)); }
@keyframes copa { 50% { transform: translateY(-6px) rotate(-4deg) scale(1.04); } }
.stepper { display: flex; gap: 4px; margin: 6px 0 10px; }
.stepper span { flex: 1; text-align: center; font-size: .66rem; font-weight: 800; padding: 6px 2px; border-radius: 8px; background: var(--soft); color: var(--mut); }
.stepper span.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.stepper span.act { background: color-mix(in srgb, var(--ama) 18%, transparent); color: var(--ama); }
.hist { list-style: none; margin: 0; padding: 0; font-size: .74rem; }
.hist li { padding: 5px 0; border-bottom: 1px dashed var(--line); color: var(--mut); }
.hist li b { color: var(--ink); }
.chat { display: grid; gap: 8px; margin-bottom: 8px; }
.msg { max-width: 86%; padding: 8px 10px; border-radius: 14px; font-size: .78rem; background: var(--scr2); border: 1px solid var(--line); }
.msg small { display: block; color: var(--mut); font-size: .64rem; font-weight: 700; margin-bottom: 2px; }
.msg.yo { justify-self: end; background: color-mix(in srgb, var(--jef) 12%, var(--scr2)); border-color: color-mix(in srgb, var(--jef) 35%, var(--line)); border-style: dashed; }

/* portada y final (pantalla completa) */
.grande { padding: clamp(18px, 4vw, 34px); border-radius: 24px; background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--sh); animation: entra .5s ease both; }
.hero-t { font-size: clamp(1.7rem, 4.2vw, 2.7rem); line-height: 1.08; letter-spacing: -.03em; margin: 8px 0 10px; }
.hero-t span { background: linear-gradient(90deg, var(--cir), var(--anest), var(--inst)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grande > p { color: var(--mut); max-width: 70ch; }
.actos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 18px 0; }
.acto-c { text-align: left; border: 1px solid var(--line); background: var(--scr2); border-radius: 18px; padding: 14px; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; }
button.acto-c:hover { transform: translateY(-3px); box-shadow: var(--sh); }
.acto-c::after { content: ''; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: color-mix(in srgb, var(--k) 16%, transparent); }
.acto-c i { font-style: normal; font-size: 1.6rem; }
.acto-c b { display: block; margin: 6px 0 3px; font-size: .95rem; }
.acto-c small { color: var(--mut); font-size: .78rem; display: block; }
.acto-c em { font-style: normal; display: inline-block; margin-top: 8px; font-size: .7rem; font-weight: 800; color: var(--k); }
.elenco { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.elenco span { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 4px 10px 4px 4px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); }
.elenco .av { width: 26px; height: 26px; font-size: .8rem; }
.botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.botones .b { width: auto; padding: 12px 18px; font-size: .92rem; margin: 0; }

/* el foco: lo que hay que tocar */
.foco { position: relative; z-index: 2; animation: latido 1.6s ease-in-out infinite !important; outline: 3px solid var(--acento); outline-offset: 3px; }
.foco::after { content: '👆'; position: absolute; right: 8px; bottom: -16px; font-size: 1.35rem; pointer-events: none; animation: dedo 1.2s ease-in-out infinite; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
@keyframes latido { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acento) 45%, transparent); } 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--acento) 0%, transparent); } }
.sacude { animation: sacude .4s !important; }
@keyframes sacude { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 160%); z-index: 90; width: min(560px, calc(100% - 32px)); display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--bg2); border: 1px solid var(--line); box-shadow: 0 20px 50px -20px rgba(2,6,23,.6); font-size: .88rem; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.toast.on { transform: translate(-50%, 0); }
.toast i { font-style: normal; font-size: 1.2rem; }
.toast.ok { border-left: 5px solid var(--ok); } .toast.info { border-left: 5px solid var(--cir); }
.papel { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 95; pointer-events: none; border-radius: 2px; animation: cae linear forwards; }
@keyframes cae { to { transform: translateY(110vh) rotate(720deg); opacity: .7; } }

@media (max-width: 1559px) {
  .cuerpo { grid-template-columns: 1fr; }
  .mapa { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); max-height: none; border-radius: 0 20px 20px 0; z-index: 60; transform: translateX(-105%); transition: transform .3s ease; background: var(--bg2); }
  .mapa.abierto { transform: none; }
  .velo.abierto { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(2,6,23,.45); }
  .mapa-btn { display: inline-flex; align-items: center; }
}
@media (max-width: 1099px) { .foco-btn { display: inline-flex; align-items: center; } }
@media (max-width: 640px) { .corto { display: inline; } .largo { display: none; } }
/* Escenario: relato fijo a la izquierda y las pantallas a la derecha, todo a la vista. */
@media (min-width: 1100px) {
  .esc-grid { display: grid; grid-template-columns: minmax(290px, 350px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .col-rel { position: sticky; top: 74px; }
  .col-esc .riel { margin-top: 0; }
}
@media (max-width: 640px) {
  #app { padding: 8px 12px 40px; }
  .marca small { display: none; }
  .marca b { font-size: .86rem; }
  .scr { height: auto; min-height: 300px; overflow: visible; }
  .dev { border-radius: 28px; padding: 7px; } .dev-in { border-radius: 22px; }
  .escenario { gap: 16px; }
  .relato { padding: 14px 14px 14px 16px; }
  .atajos { display: none; }
}
@media (max-width: 400px) { .marca > div { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 3.25 · cama y reprogramación */
.sects{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 8px}
.sect{position:relative;border-radius:12px;padding:8px 8px 8px 12px;border:2px solid color-mix(in srgb,var(--c) 25%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--sup,#fff));overflow:hidden}
.sect::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sect em{font-style:normal;font-size:1.1rem}.sect b{display:block;font-size:.72rem;line-height:1.2;color:var(--ink)}
.sect small{font-size:.66rem;color:var(--mut)}.sect small span{font-weight:900;color:var(--c);font-size:.8rem}
.sect.on{border-color:var(--c);box-shadow:0 6px 16px -8px var(--c);animation:sectOn 1.8s ease-in-out infinite}
@keyframes sectOn{50%{transform:translateY(-2px)}}
.sello{display:inline-block;font-weight:900;font-size:.7rem;color:#fff;background:linear-gradient(120deg,#dc2626,#ea580c);border-radius:99px;padding:3px 10px;box-shadow:0 4px 12px -4px #dc2626;animation:sello 2s ease-in-out infinite}
.sello.chico{font-size:.6rem;padding:2px 7px}
@keyframes sello{50%{box-shadow:0 0 0 5px rgba(220,38,38,.2),0 4px 12px -4px #dc2626}}
.prio{background:linear-gradient(135deg,color-mix(in srgb,#dc2626 8%,var(--sup,#fff)),color-mix(in srgb,#f59e0b 10%,var(--sup,#fff)))!important}
.busca{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0 10px}
.busca div{border-radius:10px;padding:7px 4px;text-align:center;font-size:.7rem;opacity:0;animation:busca .45s calc(var(--i)*.35s) ease forwards}
.busca .no{background:color-mix(in srgb,#94a3b8 18%,transparent);color:var(--mut)}.busca .no small{text-decoration:line-through}
.busca .si{background:#16a34a;color:#fff;box-shadow:0 6px 14px -6px #16a34a}
.busca b,.busca small{display:block}
@keyframes busca{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
.oks3{display:grid;gap:5px;margin:8px 0}
.campana{font-size:2.6rem;text-align:center;animation:campana 1.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes campana{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(18deg)}80%{transform:rotate(-16deg)}90%{transform:rotate(9deg)}}
.partes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.partes>*{border:0;border-radius:12px;padding:10px 6px;text-align:center;color:#fff;background:var(--c);font:inherit;font-size:1.1rem;box-shadow:0 8px 18px -10px var(--c)}
.partes b{display:block;font-size:.66rem;margin-top:3px}
.partes span{opacity:.75}
.mini-parte{padding:0!important;overflow:hidden}
.mp-h{background:linear-gradient(110deg,#0f2a5f,#1e40af 60%,#0e7490);color:#fff;font-weight:800;font-size:.78rem;padding:7px 10px}
.mp-f{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;font-size:.74rem;color:var(--ink);background:#fef2f2}
.mp-f>b{color:#1e3a8a;font-size:.9rem}.mp-f i{font-style:normal;font-weight:800;color:#155e75;background:#ecfeff;border-radius:4px;padding:0 4px;font-size:.62rem}
.mp-f small{display:block;color:#1d4ed8;font-weight:700;font-size:.64rem;margin-top:2px}
.mp-ints{font-size:.62rem;font-weight:700;text-align:center;color:#1e3a8a;padding:5px;border-top:1px dashed #cbd5e1}
@media (prefers-reduced-motion:reduce){.sect.on,.sello,.campana,.busca div{animation:none;opacity:1}}

/* 3.26 · mapa de camas y pulsera */
.alarma{text-align:center;border-radius:16px;padding:16px 10px;color:#fff;background:linear-gradient(135deg,#dc2626,#ea580c);box-shadow:0 12px 26px -12px #dc2626;margin-bottom:10px;animation:alarma 1s ease-in-out infinite}
.alarma b{display:block;font-size:.95rem;margin-top:4px}.alarma small{font-size:.72rem;opacity:.95}
@keyframes alarma{50%{transform:scale(1.025)}}
.mm{border-radius:12px;border:1px solid color-mix(in srgb,#2563eb 30%,transparent);padding:7px;background:color-mix(in srgb,#2563eb 5%,var(--sup,#fff));margin-bottom:6px}
.mm-h{display:flex;gap:8px;align-items:center;font-size:.72rem;margin-bottom:5px}.mm-h b{color:#2563eb}.mm-h span{color:var(--mut)}.mm-h em{margin-left:auto;font-style:normal;font-weight:900;color:#fff;background:#16a34a;border-radius:8px;padding:1px 7px}
.mm-habs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mm-habs>div{border:1px dashed color-mix(in srgb,#2563eb 30%,transparent);border-radius:8px;padding:3px}
.mm-habs small{display:block;font-size:.56rem;font-weight:800;color:var(--mut)}
.mm-habs span{display:flex;gap:3px}
.mm-habs i{flex:1;font-style:normal;border-radius:6px;color:#fff;background:var(--e);text-align:center;font-size:.7rem;line-height:1.1;padding:3px 0;box-shadow:0 4px 8px -5px var(--e);transition:background .4s}
.mm-habs i b{display:block;font-size:.55rem}
.mm-habs i.foco-cama{animation:cmLibreM 1s ease-in-out infinite}
@keyframes cmLibreM{50%{box-shadow:0 0 0 4px rgba(22,163,74,.35)}}
.mm-ley{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.62rem;font-weight:700;color:var(--mut);margin:2px 0 6px}
.mm-ley span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--e);margin-right:3px;vertical-align:-1px}
.pulsera{display:grid;grid-template-columns:18px 46px 1fr 50px 70px 18px;align-items:center;gap:5px;border:1.5px dashed #64748b;border-radius:10px;padding:3px;background:linear-gradient(90deg,#eff6ff,#fff 35%,#fff 70%,#f5f3ff);margin:6px 0;overflow:hidden}
.pulsera .pg{writing-mode:vertical-rl;font-size:.45rem;font-weight:900;color:#94a3b8;background:repeating-linear-gradient(45deg,#f1f5f9 0 3px,#e2e8f0 3px 6px);height:100%;display:grid;place-items:center;border-radius:5px}
.pulsera .pq svg{width:44px;height:44px;display:block}
.pulsera .pd b{display:block;font-size:.68rem;color:#0f172a}.pulsera .pd small{display:block;font-size:.55rem;color:#475569}.pulsera .pd em{font-style:normal;font-weight:900;color:#b91c1c;font-size:.58rem}
.pulsera .pu{background:#2563eb;color:#fff;border-radius:6px;font-size:.52rem;font-weight:800;text-align:center;padding:4px 2px;line-height:1.3}
.pulsera .pf small{display:block;font-size:.5rem;color:#334155}.pulsera .pf code{display:block;font-size:.48rem;color:#1e3a8a;background:#eef2ff;border-radius:3px;padding:1px 2px;margin-top:2px}
@media (prefers-reduced-motion:reduce){.alarma,.mm-habs i.foco-cama{animation:none}}

<script>
/* =====================================================================
   MANUAL INTERACTIVO · HRU Quirófanos
   Personas, pacientes y números son de ejemplo. No toca la base ni la app:
   solo recuerda en este navegador en qué paso quedó (y el tema elegido).

   Cómo está armado: PASOS es la lista ordenada del recorrido. Cada paso dice
   quién actúa (q), qué pantalla se ve (ver), qué hay que tocar (t) y qué
   cambia al tocarlo (hacer). El estado de cualquier paso se obtiene
   «rebobinando»: se parte de cero y se aplican los `hacer` de los pasos
   anteriores. Así se puede ir y volver por el mapa sin que nada se desarme.
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Volver a la app donde se la dejó: si el manual se abrió desde la app en otra
   pestaña, se cierra esta; si se abrió en la misma ventana, atrás; si llegó por
   un enlace suelto, abre la app. */
function volverApp() {
  const planB = () => {
    if (history.length > 1) { history.back(); return; }
    let desde = '';
    try { desde = new URLSearchParams(location.search).get('desde') || ''; } catch (e) {}
    location.href = '../' + (/^#[a-z]+$/.test(desde) ? desde : '');
  };
  try {
    if (window.opener && !window.opener.closed) {
      try { window.opener.focus(); } catch (e) {}
      window.close();
      setTimeout(() => { if (!window.closed) planB(); }, 400);
      return;
    }
  } catch (e) {}
  planB();
}

/* ---------- el elenco ---------- */
const R = {

/* Un QR de mentira, siempre igual (es un dibujo: no se puede escanear). */
function qrSVG() {
  const n = 25; let s = 7, r = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const fin = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0f172a"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#0f172a"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const enMarca = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!enMarca && rnd() > .52) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="#0f172a"/>`;
  }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Código QR de ejemplo">${r}${fin(0, 0)}${fin(n - 7, 0)}${fin(0, n - 7)}</svg>`;
}

PR({ e: 'Admisión y Jefatura', r: 'adm', q: 'adm', h: 'Lun 11:40', tit: 'Admisión y Egresos autoriza', txt: 'Admisión revisa los requisitos y la cobertura, y dictamina. Mire el teléfono de Ana: cambia en el mismo momento.', t: 'autorizar', go: 'Toque «Autorizar»', ver: scrAdmision, hacer: (S) => { S.p.adm = 'ok'; S.p.jef = 'pend'; }, ok: 'Autorizada. En el teléfono de Ana: «Admisión ✓ · Jefatura validando…».' });
PR({ e: 'Admisión y Jefatura', r: 'jef', q: 'jef', h: 'Lun 12:05', tit: 'La Jefatura valida… o cancela', txt: 'La Jefatura de Quirófanos ve el turno en «Ahora te toca», ordenado por urgencia. Puede validarlo y confirmarlo en el parte, o cancelarlo (toque «Cancelar» para ver qué pasaría).', t: 'validar', go: 'Toque «Validar y confirmar»', ver: scrJefatura, hacer: (S) => { S.p.jef = 'ok'; }, ok: 'Validada y confirmada en el parte. Ana lo ve al instante.' });
PR({ e: 'Ingreso y cama', r: 'cama', q: 'adm', h: 'Jue 07:05', tit: 'Paso 4: Admisión anota la cama', txt: 'Jueves, 07:05. Ana ingresa al hospital. Admisión y Egresos anota en qué sector, habitación y cama queda internada. Cada sector tiene su interno para llamarla a quirófano: <b>Adultos 1035 · Pediatría 1012 · Maternidad 1608 · UCI 1034</b>. «Guardar cama» se prende recién con sector, habitación, cama y el nombre de quien la anota.', t: 'cama', go: 'Toque «Guardar cama»', ver: scrCama, hacer: (S) => { S.p.cama = true; }, ok: 'Cama registrada: aparece en la ficha, en el parte y en el teléfono de Ana.' });
PR({ e: 'Llega el equipo', r: 'eq', q: 'anest', h: 'Jue 07:32', tit: 'El día de la cirugía: la anestesióloga da el OK', txt: 'Jueves, 07:32. La Dra. Paz llega y marca «Llegué». Es la puerta del día: sin llegada no se toman cirugías ni se firma.', t: 'llegue', go: 'Toque «Llegué»', ver: scrLlegue, hacer: (S) => { S.p.llego = true; }, ok: 'Anestesia presente. Ya figura en la cirugía de las 08:00.' });
PR({ e: 'Llega el equipo', r: 'pa', q: 'anest', h: 'Jue 07:41', tit: 'El parte pre-anestésico, en una foto', txt: 'Después de «Llegué», en la cirugía en que está anotada, la Dra. Paz saca una foto del parte anestésico pre-quirúrgico. La app la achica en el teléfono y la guarda <b>aparte</b>: los demás ven «💉 Parte pre-anestésico» y la bajan solo si la necesitan.', t: 'parte', go: 'Toque «Sacar foto del parte»', ver: scrParteAnest, hacer: (S) => { S.p = S.p || {}; S.p.parte = true; }, ok: 'Parte adjuntado: 212 KB.' });
PR({ e: 'Llega el equipo', r: 'eq', q: 'enf', h: 'Jue 07:40', tit: 'La enfermera toma la cirugía', txt: 'La Lic. Molina se anota como circulante. Una persona, una sala: desde ahora sus firmas son de esta cirugía.', t: 'tomar', go: 'Toque «Anotarme» en Circulante', ver: (S) => scrSala(S, 'enf'), hacer: (S) => { S.p.enf = true; }, ok: 'Circulante anotada.' });
PR({ e: 'Llega el equipo', r: 'eq', q: 'inst', h: 'Jue 07:44', tit: 'La instrumentadora toma la cirugía', txt: 'Carla Ruiz se anota y verifica las cajas. Sin instrumentadora anotada no hay recuento inicial, y sin recuento no se sigue.', t: 'tomar', go: 'Toque «Anotarme» en Instrumentación', ver: (S) => scrSala(S, 'inst'), hacer: (S) => { S.p.inst = true; }, ok: 'Equipo completo. Ana ve «Tu equipo está listo».' });
PR({ e: 'LVQ, gasas y Pausa', r: 'ent', q: 'enf', h: 'Jue 07:58', tit: 'Empieza la LVQ: Entrada', txt: 'La Lista de Verificación Quirúrgica arranca antes de la inducción. Enfermería y anestesia la firman, con el cirujano presente.', t: 'entrada', go: 'Toque «Firmar la Entrada»', ver: scrEntrada, hacer: (S) => { S.p.ent = true; }, ok: 'Entrada firmada. Ana: «En quirófano».' });
PR({ e: 'LVQ, gasas y Pausa', r: 'rec1', q: 'inst', h: 'Jue 08:05', tit: 'Conteo de gasas inicial', txt: 'La instrumentadora cuenta gasas, compresas, agujas e instrumental. Contra ese número se compara al final.', t: 'rec1', go: 'Toque «Guardar recuento inicial»', ver: () => scrRecuento(false), hacer: (S) => { S.p.rec1 = true; }, ok: 'Recuento inicial guardado: 10 gasas, 5 compresas, 4 agujas, 38 instrumentos.' });
PR({ e: 'LVQ, gasas y Pausa', r: 'pau', q: 'cir', h: 'Jue 08:18', tit: 'Pausa quirúrgica', txt: 'Antes de la incisión, todo el equipo se detiene: nombres, paciente, sitio, antibiótico. Confirman cirujano, anestesia y enfermería.', t: 'pausa', go: 'Toque «Confirmar la Pausa»', ver: scrPausa, hacer: (S) => { S.p.pausa = true; }, ok: 'Pausa confirmada por los tres.' });
PR({ e: 'Cirugía y cierre', r: 'ini', q: 'cir', h: 'Jue 08:21', tit: 'Inicio de la cirugía', txt: 'Con Entrada, recuento y Pausa hechos, se habilita el inicio. Desde ahora corre el tiempo quirúrgico.', t: 'inicio', go: 'Toque el botón «Iniciar»', ver: scrInicio, hacer: (S) => { S.p.ini = true; }, ok: 'Cirugía en curso. Ana (y su familia) ven «Operándote».' });
PR({ e: 'Cirugía y cierre', r: 'rec2', q: 'inst', h: 'Jue 09:34', tit: 'Recuento final', txt: 'Antes del cierre, instrumentación y enfermería vuelven a contar. Tiene que coincidir con el inicial.', t: 'rec2', go: 'Toque «Confirmar recuento»', ver: () => scrRecuento(true), hacer: (S) => { S.p.rec2 = true; }, ok: 'Recuento final correcto. Se habilita la Salida.' });
PR({ e: 'Cirugía y cierre', r: 'sal', q: 'cir', h: 'Jue 09:41', tit: 'Final de la LVQ y cierre', txt: 'El cirujano completa la Salida con el parte quirúrgico. Con eso la cirugía se cierra sola: la Jefatura no tiene que intervenir.', t: 'salida', go: 'Toque «Finalizar (LVQ Salida + parte)»', ver: scrSalida, hacer: (S) => { S.p.sal = true; }, ok: 'Salida firmada. Se activa el módulo de Recuperación.' });
PR({ e: 'Recuperación y QR', r: 'rec', q: 'anest', h: 'Jue 10:35', tit: 'Se activa el módulo de Recuperación', txt: 'La paciente pasa a recuperación. La anestesióloga completa la escala de Aldrete: con 9 o más, alta.', t: 'alta', go: 'Toque «Dar el alta de recuperación»', ver: scrAldrete, hacer: (S) => { S.p.recup = true; }, ok: 'Alta de recuperación. Ana ve «Tu cirugía terminó».' });
PR({ e: 'Recuperación y QR', r: 'lin', q: 'anest', h: 'Jue 13:10', tit: 'Mi línea: el tiempo entre cirugías', txt: 'En su Portal (ahora con diseño de infografía), la anestesióloga ve su línea del día: cada cirugía con su tiempo en sala y, entre una y otra, el <b>recambio</b> —de la salida de un paciente a la entrada del siguiente—, en verde hasta 30 min, ámbar hasta 45 y rojo después, con cronómetro en vivo y los totales del día.', t: 'entro', go: 'Toque «Entró el paciente 4 · Ahora»', ver: scrMiLinea, ok: 'Recambio 3 cerrado: 13 min. Arranca el tiempo en sala de la cirugía 4.' });
PR({ e: 'Recuperación y QR', r: 'fin', q: 'cir', h: 'Jue 10:36', tit: 'El QR de la paciente se cierra', txt: 'Con la cirugía finalizada, el pase caduca solo: el QR deja de abrir para siempre. Compruébelo en el teléfono de Ana.', t: 'reabrir', go: 'En el teléfono de Ana, toque «Volver a abrir el QR»', ver: () => scrResumen(false), hacer: (S) => { S.p.qr = true; }, ok: 'El QR ya no abre nada: sus datos quedan protegidos.' });
PR({ e: 'Recuperación y QR', r: 'fin+', q: 'cir', h: 'Jue 10:37', tit: 'Caso cerrado', txt: 'Todos los tiempos quedaron registrados solos y van a las estadísticas. El teléfono de Ana muestra el pase cerrado.', t: 'seguir', go: 'Toque «Seguir: una urgencia»', ver: () => scrResumen(true), ok: 'Ahora, una urgencia.' });
PR({ e: 'Recuperación y QR', r: 'fin+', q: 'jef', h: 'Otro día', tit: 'Cesárea y parto en Obstetricia', txt: 'En el panel de Obstetricia, programado o de urgencia, el campo <b>Atención</b> dice Cesárea o Parto. La cesárea sigue los pasos que acaba de ver, con recuentos. El parto programado <b>no pasa por la Jefatura</b>: lo confirma Admisión. Tiene 5 momentos, sin conteo de gasas y sin instrumentación, siempre con anestesiólogo/a, y su consentimiento es el <b>obstétrico</b>.', t: 'cesarea', go: 'Toque «Entendido»', ver: scrCesarea, fiesta: true, ok: 'Cesárea con gasas, parto sin gasas.' });

/* Acto · Endoscopía programada (3.33 a 3.39) */
const EN = (o) => P(Object.assign({ a: 'endo' }, o));
EN({ e: 'Programar', r: 'prog', q: 'cir', h: 'Lun 09:10', tit: 'El/la endoscopista anota el estudio', txt: 'Elige el turno en la grilla de Endoscopía. Su Jefe/a de Endoscopía abre los días y es quien habilita lo que va fuera de término. El consentimiento es el <b>endoscópico</b>: habla de endoscopista y de estudio, con riesgos y cuidados propios, y va con su preparación. A Endoscopía no se le piden Instrumentación ni Esterilización.', t: 'enprog', go: 'Toque «Enviar el turno»', ver: scrEndo('🔭 Nueva endoscopía', 'Sala de Endoscopía', ['✓ Apto anestésico', '✓ Preparación indicada', '✓ Consentimiento Informado Endoscópico'], 'enprog', '📨 Enviar el turno'), ok: 'Turno enviado a Admisión.' });
EN({ e: 'Programar', r: 'prog', q: 'cir', h: 'Lun 09:12', tit: 'La app recomienda la prioridad', txt: 'El turno nuevo se carga de a un paso, con cinco casilleros arriba. En <b>Prioridad</b> la app mira la edad, el diagnóstico, los factores tildados, los recursos pedidos y las suspensiones previas del mismo DNI, y dice cuál recomienda y por qué. Cada opción del desplegable explica qué significa. Decide el médico.', t: 'enprio', go: 'Toque «Aplicar»', ver: scrEndo('⭐ La app recomienda: P3 · Alta complejidad', 'Mirando este caso', ['78 años: conviene acortar el ayuno', 'Diabetes: mejor temprano por el ayuno', '1 suspensión en el último año'], 'enprio', '✓ Aplicar'), ok: 'Prioridad aplicada.' });
EN({ e: 'Admisión', r: 'adm', q: 'adm', h: 'Lun 11:40', tit: 'Admisión autoriza y queda confirmada', txt: 'Acá hay una diferencia: <b>no pasa por la Jefatura de Quirófanos</b>. Si a 48 h hábiles sigue sin autorizar, el/la Jefe/a de Endoscopía recibe la alerta y decide si toca <b>Dar de baja y liberar el turno</b>. Si la da de baja, el médico y el paciente reciben un correo. Con la autorización de Admisión y Egresos, la endoscopía queda confirmada sola.', t: 'enadm', go: 'Toque «Autorizar»', ver: scrEndo('🗂️ Ingresos del día', 'Endoscopía · para autorizar', ['Autoriza Admisión', 'Se confirma sola', 'Sin paso por la Jefatura de Quirófanos'], 'enadm', '🗂️ Autorizar'), ok: 'Endoscopía confirmada.' });
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Lun 11:45', tit: 'Ver la preparación que recibió', txt: 'Con el turno confirmado, el pase le llega solo al paciente por correo, con la <b>preparación</b> del protocolo del HRU (VEDA o colonoscopía) y el consentimiento para leer y aceptar. Para leer esa preparación no hace falta el código del paciente: en la ventana del pase, la tarjeta <b>Preparación</b> la muestra igual que la ve él, con el día en que salió y un botón para imprimirla.', t: 'enprep', go: 'Toque «Preparación»', ver: scrEndo('🎫 Pase del paciente', 'Enviado por correo · VEDA', ['✓ Enlace y QR', '✓ Preparación (protocolo del HRU)', '✓ Consentimiento para aceptar', 'Venir acompañado'], 'enprep', '🧾 Preparación'), ok: 'Ahí está la preparación completa: dieta, medicación, qué traer y cuidados después.' });
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Lun 11:50', tit: 'El consentimiento es del estudio que se hace', txt: 'La app arma el consentimiento según el estudio del turno: en una <b>VEDA</b> dice que el endoscopio entra <b>por la boca</b>; en una <b>colonoscopía</b>, <b>por el ano</b>; si se hacen las dos en el mismo acto, lleva las dos. No deja guardar ni mandar al pase el texto del otro estudio: si alguno quedó mal, lo corrige sola, actualiza el pase y le pide al paciente aceptarlo de nuevo (con un correo).', t: 'enci', go: 'Toque «Consentimiento»', ver: scrEndo('📝 Consentimiento', 'VEDA · por la boca', ['✓ Punto 4: por la boca', '✓ Sin texto de colonoscopía', '✓ Mismo texto en el pase', 'Si cambia, el paciente acepta de nuevo'], 'enci', '📝 Consentimiento'), ok: 'El texto dice exactamente el estudio que se le va a hacer.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Lun 12:30', tit: 'El/la Jefe/a genera el parte antes de las 14 h', txt: 'El parte de Endoscopía se publica solo a las <b>14 h del día hábil previo</b>, para todos. Antes de esa hora, <b>solo el/la Jefe/a de Endoscopía</b> puede generarlo desde su pantalla <b>Jefatura de Endoscopía</b>, en <b>Parte de Endoscopía</b>: elige la fecha y toca <b>Imprimir el parte</b>: pide su contraseña y muestra lo confirmado hasta ese momento, marcado <b>PRELIMINAR</b>, para ver, imprimir o guardar en PDF. No queda guardado en la app: al cerrar la ventana, desaparece.', t: 'enparte', go: 'Toque «Imprimir el parte»', ver: scrEndo('📄 Parte de Endoscopía', 'Antes de las 14 h · solo el/la Jefe/a', ['2 estudios confirmados', '1 sin confirmar (no figura)', 'PRELIMINAR en cada hoja', 'No queda guardado en la app'], 'enparte', '📄 Imprimir el parte'), ok: 'Pidió su contraseña y abrió el parte preliminar. A las 14 h sale el definitivo para todos.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Lun 12:40', tit: 'Cerrar una endoscopía que nadie cargó', txt: 'Si pasó la fecha y nadie dijo qué pasó, el turno queda <b>Sin resolver</b>. El/la Jefe/a de Endoscopía toca <b>Resolver turno</b> y elige: <b>Se realizó</b> (horas, informe del estudio, motivo y Lista de Verificación en papel), <b>No se realizó</b> (con su causa) o <b>Se realizó antes</b>. El botón verde se prende recién con todo lo obligatorio (*) completo y, para registrar el estudio, pide su contraseña.', t: 'enres', go: 'Toque «Resolver turno»', ver: scrEndo('⚠️ Turno sin resolver', '¿Qué pasó con esta endoscopía?', ['Se realizó la colonoscopía', 'No se realizó', 'Se realizó antes', 'Botón apagado hasta completar (*)'], 'enres', '⚠️ Resolver turno'), ok: 'Quedó Finalizada, a su nombre, con el informe del estudio.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Lun 12:45', tit: 'Las franjas, mes por mes', txt: 'En <b>Jefatura de Endoscopía › Franjas</b> el/la Jefe/a ve un <b>calendario del mes</b> y pasa de mes con las flechas, <b>hasta 12 meses adelante</b>. Toca <b>Mañ</b> o <b>Tar</b> para abrir o cerrar esa franja, el <b>número del día</b> para el día entero, <b>«sem»</b> para toda la semana y los botones de abajo para el <b>mes entero</b> (abrir solo toca los días hábiles). Si cierra algo con turnos anotados, la app avisa: cerrar no suspende esos turnos.', t: 'enfra', go: 'Toque «Abrir los días hábiles»', ver: scrEndo('🗓️ Franjas de Endoscopía', 'Calendario de diciembre · hasta 12 meses', ['Mañ / Tar: una franja', 'Número del día: el día entero', '«sem»: la semana', 'Abrir o cerrar el mes'], 'enfra', '✓ Abrir los días hábiles'), ok: 'Quedaron abiertos los días hábiles del mes; los feriados y fines de semana siguen cerrados.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Lun 12:50', tit: 'Tres ventanas que despliegan', txt: 'Arriba de la pantalla del/la Jefe/a hay tres ventanas: <b>Confirmadas</b>, <b>En espera de Admisión y Egresos</b> y <b>Sin resolver</b>. Las tarjetas no se ven sueltas: cada ventana, al tocarla, despliega <b>solo sus turnos</b>, y tocándola otra vez se cierra. Abajo hay un enlace al historial de 60 días.', t: 'envent', go: 'Toque «Sin resolver»', ver: scrEndo('⚠️ Sin resolver · 2', 'Solo los turnos de esta ventana', ['Confirmadas · 3', 'En espera de Admisión · 1', 'Sin resolver · 2', 'Tocar otra vez la cierra'], 'envent', '⚠️ Sin resolver'), ok: 'Se desplegaron solo los turnos sin resolver.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mié 13:00', tit: 'Hecha y sin cerrar a las 48 h: módulo al 50 %', txt: 'Una endoscopía <b>ya hecha</b> (también la de guardia) tiene <b>48 h desde que terminó</b> para cerrarse: informe del estudio, Lista de Verificación y acreditación de Admisión y Egresos. A las 24 h llega el aviso «Quedan X h». Pasadas las 48 h aparece en <b>Sin resolver</b>: Admisión la acredita igual (sección <b>Para acreditar</b> de Ingresos) y el/la endoscopista la finaliza igual, pero <b>el módulo se liquida al 50 % del valor vigente</b>, y queda anotado en el historial y en Módulos.', t: 'en48', go: 'Toque «Cargar informe del estudio»', ver: scrEndo('⏱ Sin cerrar hace 52 h', 'Falta: informe del estudio', ['Admisión ya la acreditó', 'Se puede cerrar igual', 'Módulo al 50 %', 'Queda en el historial'], 'en48', '📄 Cargar informe del estudio'), ok: 'Quedó Finalizada; en Módulos figura «al 50 %».' }),
EN({ e: 'Cierre', r: 'sal', q: 'cir', h: 'Jue 10:30', tit: 'El paciente retira su informe en METRIA', txt: 'Al quedar <b>finalizada</b> la endoscopía, el pase del paciente cambia solo: <b>«Tu estudio terminó — Tu informe va a estar en METRIA»</b>, con el botón <b>Retirar mi informe en METRIA</b>, y le llega un correo con el mismo botón. En METRIA entra con su correo, un código y su DNI; el endoscopista le sube el PDF y las fotos (se achican solas). Las descarga y las guarda: se borran de la app a los pocos días.', t: 'enmetria', go: 'Toque «Retirar mi informe en METRIA»', ver: scrEndo('✅ Tu estudio terminó', 'Tu informe va a estar en METRIA', ['1 · Entrá con tu correo', '2 · Código + DNI', '3 · Estudios: informe y fotos', '🔒 Se borran después de bajarlos'], 'enmetria', '➜ Retirar mi informe en METRIA'), ok: 'El paciente entró a METRIA y descargó su informe.' }),
EN({ e: 'Cierre', r: 'sal', q: 'cir', h: 'Jue 10:40', tit: 'Finalizada y cerrada: ya no se modifica', txt: 'Cuando el endoscopista o el cirujano <b>finaliza y cierra</b>, el turno queda para consulta. En <b>Mis Solicitudes</b> y en la ficha ya no aparecen «Modificar dictamen de Admisión» ni el PDF del consentimiento (queda guardado en <b>Consentimientos Informados</b>), y en el turno desaparece <b>«Eliminar o pasar a otro día»</b>. El recorrido se ve todo en verde: el pase dice que al paciente se le avisa que retire su informe en <b>METRIA</b> y el último paso dice <b>Ficha completa</b>. Única excepción: en las <b>urgencias</b>, donde Admisión autoriza en diferido, el dictamen se puede rectificar.', t: 'encerrada', go: 'Toque «Ficha completa»', ver: scrEndo('🔒 Endoscopía finalizada y cerrada', 'Ya no se modifica: queda para consulta', ['✓ Consentimiento · en Consentimientos Informados', '✓ Pase · se le avisa que retire su informe en METRIA', '✓ Admisión y Egresos · aceptado', '✓ Equipo y módulos'], 'encerrada', '✓ Ficha completa'), ok: 'La ficha se abre solo para leer: sin botones que modifiquen.' }),
EN({ e: 'En sala', r: 'lvq', q: 'enf', h: 'Jue 08:00', tit: 'La lista de Endoscopía: 11 puntos, entre los cuatro', txt: 'La Lista de Verificación de Endoscopía es propia: <b>11 puntos en tres momentos</b> (Antes de sedar 5 · Antes de empezar 3 · Al terminar 3). Arriba se ven <b>los cuatro</b> de la sala. <b>Tilda cualquiera de los cuatro y lo ven todos al instante</b>. Con <b>✓ Todo verificado</b> se tildan de una vez; con <b>⚠ Hay una novedad</b> se deja escrito algo a tener en cuenta, a la vista del equipo y en el historial. El botón de confirmar queda apagado y dice cuántos puntos faltan.', t: 'enlvq11', go: 'Toque «Todo verificado»', ver: scrEndo('1 · Antes de sedar', 'Tilda cualquiera de los cuatro', ['✓ Identidad, estudio y consentimiento', '✓ Ayuno y preparación', '○ Alergias y anticoagulantes', '○ Vía aérea · ○ Oxímetro y monitoreo'], 'enlvq11', '✓ Todo verificado'), ok: 'Los cinco puntos quedaron tildados en los cuatro teléfonos.' }),
EN({ e: 'Cierre', r: 'sal', q: 'cir', h: 'Vie 09:00', tit: 'Enmienda con motivo en un caso cerrado', txt: 'El cierre es firme, pero un error se puede corregir a la vista: en la <b>ficha</b> del caso cerrado, el endoscopista o el cirujano (o su Jefatura) toca <b>✏️ Enmienda con motivo</b>. Elige <b>corregir el informe</b> o <b>agregar una aclaración</b>, escribe el <b>motivo</b> y confirma con su contraseña. Lo anterior <b>no se borra</b>: queda guardado con quién, cuándo y por qué. No reabre el caso ni cambia módulos.', t: 'enenm', go: 'Toque «Registrar la enmienda»', ver: scrEndo('✏️ Enmienda con motivo', 'Lo anterior queda guardado', ['◉ Corregir el informe del estudio', '○ Agregar una aclaración', 'Motivo: se omitió describir un pólipo', '🔑 Se confirma con su contraseña'], 'enenm', 'Registrar la enmienda'), ok: 'La enmienda quedó en la ficha, con el texto anterior a la vista.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mié 13:10', tit: 'Preguntale a la app lo que consideres', txt: 'En el Panel hay una barra para preguntarle a la app. Responde con sus propios datos, sin inteligencia artificial: <b>«¿por qué el módulo de Alegre salió al 50 %?»</b>, <b>«¿cuántas endoscopías mías tiene Admisión sin autorizar?»</b>, <b>«¿cuántos módulos llevo?»</b> (comparado con el mes pasado a la misma fecha, con su importe), <b>«¿quién está de guardia el 20/11?»</b>. Sin ingresar, solo cómo se usa la app. Nada se guarda.', t: 'enpreg', go: 'Toque «Preguntar»', ver: scrEndo('💬 Preguntale a la app', 'lo que consideres', ['¿Por qué el módulo de Alegre salió al 50 %?', 'Se liquida al 50 %: cerrada 52 h después', 'Lleva 12 módulos este mes (+3)', 'Nada se guarda'], 'enpreg', '➤ Preguntar'), ok: 'La app respondió con el motivo y un botón para abrir el turno.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mié 13:20', tit: 'Un reclamo a la Jefatura de Endoscopía', txt: 'En <b>Reclamos</b>, quien escribe elige a quién va: <b>Jefatura de Quirófanos</b> o <b>Jefatura de Endoscopía</b>. Los de Endoscopía los ve y responde solo el/la Jefe/a de Endoscopía. El botón de enviar dice qué falta hasta elegir destino, asunto y detalle.', t: 'enrec', go: 'Toque «Enviar a la Jefatura de Endoscopía»', ver: scrEndo('✉️ Nuevo reclamo', '¿A quién va?', ['🏥 Jefatura de Quirófanos', '🔭 Jefatura de Endoscopía ✓', 'Asunto y detalle', 'Lo responde el/la Jefe/a de Endoscopía'], 'enrec', '✉️ Enviar a la Jefatura de Endoscopía'), ok: 'El reclamo llegó solo a la Jefatura de Endoscopía.' }),
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mar 08:00', tit: 'El turno lleva de la mano', txt: 'Al abrir un turno programado, un cartel grande dice <b>su próximo paso</b> y debajo se ve todo el camino. Al cumplir uno, festeja y aparece el siguiente. La tarjeta Consentimiento ya dice si firmó el paciente y si falta el médico. Los datos quedan en tarjetas plegadas.', t: 'encam', go: 'Toque «Firmar el consentimiento»', ver: scrEndo('✍️ Su próximo paso: firmar el consentimiento', 'El paciente ya firmó desde su pase', ['✓ Consentimiento guardado', '✓ Pase del paciente', '✓ Firma del paciente'], 'encam', '🖋️ Firmar el consentimiento'), ok: 'Firmado. Aparece el paso siguiente.' });
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mar 08:30', tit: 'Los botones de la tarjeta, por importancia', txt: 'En <b>Mis Solicitudes</b> cada turno confirmado muestra primero y más grande <b>▶ Pantalla de sala</b>; al lado, más chico, <b>Iniciar LVQ</b> (apagado y con la fecha hasta el día del turno). Después <b>📅 Pasar a otro día o suspender</b>, y abajo, discretos, <b>Resuelta por urgencia</b> y <b>Pase del paciente</b>. El PDF del consentimiento ya no está en la tarjeta: se baja desde la ficha, al abrir el turno.', t: 'enbot', go: 'Toque «Pasar a otro día o suspender»', ver: scrEndo('🗂 Mis Solicitudes · endoscopía confirmada', 'El orden dice qué es lo importante', ['▶ <b>Pantalla de sala</b> · el principal', '▷ Iniciar LVQ', '⚡ Resuelta por urgencia · ▦ Pase del paciente (discretos)'], 'enbot', '📅 Pasar a otro día o suspender'), ok: 'Se abre una sola ventana con las tres salidas.' });
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mar 08:32', tit: 'Pasar a otro día, suspender o eliminar', txt: 'Una sola ventana pregunta <b>¿Qué hacemos con la endoscopía?</b> y ofrece tres salidas: <b>📅 Pasarlo a otro día</b> (el mismo turno se muda, con paciente, pase y consentimiento), <b>⏸ Suspender el estudio con causa</b> (el paciente no puede venir, el médico no está disponible…: queda anotado y cuenta en las estadísticas; hay que elegir la causa para poder confirmar) y <b>🗑 Eliminar el estudio</b> (se borra como si nunca se hubiera anotado: es para un error de carga; pide su contraseña). La opción que usted no puede usar se ve <b>apagada</b> y dice por qué: pasar y eliminar son de quien creó el turno y hasta el cierre de la lista; suspender es de la Jefatura.', t: 'enqh', go: 'Toque «Suspender el estudio con causa»', ver: scrEndo('❓ ¿Qué hacemos con la endoscopía?', 'Tres salidas, una sola ventana', ['📅 Pasarlo a otro día', '🗑 Eliminar el estudio · 🔒 la lista ya cerró', 'Causa: «El paciente no puede concurrir (avisó)»'], 'enqh', '⏸ Suspender el estudio con causa'), ok: 'Queda «Suspendida», con su causa.' });
EN({ e: 'Admisión', r: 'adm', q: 'cir', h: 'Mar 09:00', tit: 'Un feriado nuevo cae sobre el turno', txt: 'La app revisa los feriados todos los días. Si un turno queda en un feriado, al médico que lo programó le aparece una <b>alerta roja</b> al abrir la app, con correo y aviso al teléfono cada día, y al paciente, en su pase y por correo. Cada una se apaga recién cuando esa persona la lee.', t: 'enfer', go: 'Toque «Leí la alerta»', ver: scrEndo('⚠️ Tiene un turno en un día feriado', 'Lunes 9 · 09:00 h', ['Feriado nacional', 'El paciente recibió la misma alerta en su pase'], 'enfer', 'Leí la alerta'), ok: 'Alerta leída: deja de sonar.' });
EN({ e: 'Ingreso', r: 'pul', q: 'adm', h: 'Jue 07:30', tit: 'Llega: pulsera, sin cama', txt: 'Es ambulatoria: no lleva cama. Admisión imprime la pulsera cuando el paciente se presenta con su DNI, y desde ese momento el equipo ve <b>🟡 Ingresó</b>.', t: 'enpul', go: 'Toque «Imprimir pulsera»', ver: scrEndo('🏷️ Ruta del paciente', 'Ambulatoria · sin cama', ['✓ Autorizada', '✓ Confirmada', 'Pulsera', 'En sala'], 'enpul', '🏷️ Imprimir pulsera'), ok: 'Pulsera lista: el paciente espera que lo llamen.' });
EN({ e: 'En sala', r: 'eq', q: 'enf', h: 'Jue 07:40', tit: 'Entran siempre cuatro', txt: 'Endoscopista, anestesiólogo/a, enfermero/a de anestesia y enfermero/a de endoscopía. Cada uno toma su lugar con <b>✋ TOMAR</b>. Instrumentación no participa.', t: 'eneq', go: 'Toque «Tomar mi lugar»', ver: scrEndo('✋ Tomar mi lugar', 'Endoscopía · 08:00', ['🩺 Endoscopista', '💤 Anestesiólogo/a', '💉 Enfermería de anestesia', '🔭 Enfermería de endoscopía'], 'eneq', '✋ Tomar mi lugar'), ok: 'Equipo completo.' });
EN({ e: 'En sala', r: 'lvq', q: 'enf', h: 'Jue 07:58', tit: 'Se lee la pulsera y se abre para todos', txt: 'Quien hace pasar al paciente toca <b>📷 Pulsera</b>, lee el QR y toca «Abrir para todo el equipo». La planilla común se abre en el equipo, con aviso si tienen la app cerrada, y lee en voz alta el/la enfermero/a de endoscopía.', t: 'enqr', go: 'Toque «Abrir para todo el equipo»', ver: scrEndo('✓ Identidad verificada', 'Pulsera · sello SHA-256 ✓', ['Paciente, DNI y estudio a la vista', 'Se abre en todo el equipo'], 'enqr', '📣 Abrir para todo el equipo'), ok: 'Planilla común abierta.' });
EN({ e: 'Lista de Verificación', r: 'ent', q: 'enf', h: 'Jue 08:00', tit: 'Entrada, sin conteo de gasas', txt: 'La Entrada es antes de la sedación. Firman Enfermería de endoscopía y Anestesiología. <b>No hay recuento inicial ni final</b>, y el punto de gasas no aparece en la lista.', t: 'enent', go: 'Toque «Confirmo»', ver: scrEndo('✅ Entrada', 'Antes de la sedación', ['Identidad, sitio y consentimiento', 'Control de seguridad anestésica', 'Alergias verificadas'], 'enent', '✓ Confirmo'), ok: 'Entrada firmada.' });
EN({ e: 'Lista de Verificación', r: 'pau', q: 'cir', h: 'Jue 08:06', tit: 'Pausa endoscópica y comienzo del estudio', txt: 'La <b>Pausa endoscópica</b> es antes de la introducción del endoscopio. Confirman endoscopista, Anestesiología y Enfermería de endoscopía.', t: 'enpau', go: 'Toque «Confirmo la Pausa e inicio»', ver: scrEndo('⏸️ Pausa endoscópica', 'Antes de la introducción', ['Equipo presentado', 'Paciente y estudio correctos', 'Eventos críticos revisados'], 'enpau', '▶ Confirmo la Pausa e inicio'), ok: 'Estudio en curso.' });
EN({ e: 'Cierre', r: 'sal', q: 'enf', h: 'Jue 08:32', tit: 'Salida y parte', txt: 'Al terminar firma la Salida el/la enfermero/a de endoscopía, y el/la endoscopista carga el parte y finaliza.', t: 'ensal', go: 'Toque «Firmar la Salida»', ver: scrEndo('🏁 Salida', 'Antes de dejar la sala', ['Estudio registrado', 'Muestras rotuladas', 'Indicaciones para recuperación'], 'ensal', '✍️ Firmar la Salida'), ok: 'Salida firmada.' });
EN({ e: 'Cierre', r: 'rec', q: 'anest', h: 'Jue 09:05', tit: 'Recuperación y siguiente paciente', txt: 'Anestesiología da el alta con la escala de Aldrete. La pantalla dice quién sigue en esa sala y si ya ingresó: su planilla se abre al leer su pulsera.', t: 'enrec', go: 'Toque «Registrar el Aldrete»', ver: scrEndo('💤 Recuperación', 'Escala de Aldrete', ['Aldrete 10/10', 'Sigue en esta sala: 08:30 · Colonoscopía'], 'enrec', '✓ Registrar el Aldrete'), fiesta: true, ok: 'Endoscopía cerrada.' });

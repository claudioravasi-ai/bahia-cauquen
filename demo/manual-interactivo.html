const MP = (o) => P(Object.assign({ a: 'mapa' }, o));
MP({ e: 'El mapa de las 07:00', r: 'al', q: 'jenf', h: 'Mar 06:30', tit: '06:30 · suena el recordatorio', txt: 'La Jefatura de Enfermería tiene su propia cuenta y entra <b>solo</b> al Mapa de camas. A las 06:30 le suena un aviso fuerte —aunque la app y el teléfono estén cerrados— para que envíe las camas del día a Admisión.', t: 'abrir', go: 'Toque «Abrir el mapa de camas»', ver: scrAlarma, ok: 'Mapa abierto.' });
MP({ e: 'El mapa de las 07:00', r: 'pin', q: 'jenf', h: 'Mar 06:40', tit: 'Pinta las camas', txt: 'Cuatro esquemas —Adultos (10 habitaciones × 2), Pediatría (12 × 2), Maternidad (8 × 3) y UCI (7 camas)— y cada cama con su color: 🟩 libre · 🟥 ocupada · 🟧 a desocupar (con la hora) · 🟨 reservada · ⬛ fuera de servicio. Todo editable, en todo momento: las urgencias mandan.', t: 'pintar', go: 'Toque el botón amarillo', ver: scrPintar, hacer: (S) => { S.m.pinto = true; }, ok: 'Cama reservada para la cirugía de las 10:00.' });
MP({ e: 'El mapa de las 07:00', r: 'env', q: 'jenf', h: 'Mar 06:52', tit: 'Enviar a Admisión', txt: 'Con el mapa al día, toca «Enviar a Admisión». Queda la foto sellada de ese momento y Admisión recibe un correo con «✓ Recibido». Si a las 07:00 nadie lo envió, la app manda sola la foto tal como está.', t: 'enviar', go: 'Toque «Enviar a Admisión»', ver: scrEnviarMapa, hacer: (S) => { S.m.envio = true; }, ok: 'Enviado. Ahora espera el «Recibido».' });
MP({ e: 'Admisión recibe', r: 'rec', q: 'adm', h: 'Mar 07:03', tit: 'Admisión toca «Recibido»', txt: 'En el correo (o en la app), Admisión toca «✓ Recibido»: se le abre el mapa que mandó Enfermería y a la Jefatura de Enfermería le llega «Recibido por Admisión ✓», con nombre y hora.', t: 'recibido', go: 'Toque «Recibido — ver las camas»', ver: scrRecibido, hacer: (S) => { S.m.recibido = true; }, ok: 'A Enfermería le llegó: «Recibido por Admisión ✓ 07:03».' });
MP({ e: 'Ingreso y pulsera', r: 'ing', q: 'adm', h: 'Mar 07:08', tit: 'Admisión entra con su cuenta', txt: 'Admisión y Egresos tiene su propia entrada («Acceso Admisión y Egresos») con tres secciones: <b>Ingresos del día</b> (los pacientes de hoy y mañana por área, con su cama, autorización y pulsera), el <b>Mapa de camas en vivo</b> y los <b>Avisos</b>. Con la sesión abierta no le pide la contraseña en cada trámite.', t: 'anotar', go: 'Toque «Anotar cama de Pérez, Juan Carlos»', ver: scrIngresosAdm, ok: 'Se abre la ventana de la cama con el mapa del sector.' });
MP({ e: 'Ingreso y pulsera', r: 'ing', q: 'adm', h: 'Mar 07:10', tit: 'Ingresa el paciente: cama verde → roja', txt: 'Al anotar la cama, Admisión ve el mapa en vivo del sector y toca una cama verde. Al guardar, en el mapa de Enfermería esa cama pasa a <b>rojo</b>, con las iniciales del paciente.', t: 'tocar', go: 'Toque la cama verde marcada (Hab. 4 · Cama 1)', ver: scrIngresoMapa, hacer: (S) => { S.m.ingreso = true; }, ok: 'Hab. 4 · Cama 1: ocupada. Se imprime la pulsera.' });
MP({ e: 'Ingreso y pulsera', r: 'pul', q: 'adm', h: 'Mar 07:11', tit: 'La pulsera sale sola', txt: 'QR, apellido y nombre, DNI, patología, sector/habitación/cama, quién le dio ingreso y un sello <b>SHA-256</b> de esos datos. Sale en tira: se corta con tijera y se pega en la muñeca (la copia va a la historia clínica).', t: 'pegar', go: 'Toque «Cortar y pegar en la muñeca»', ver: scrPulsera, ok: 'Pulsera puesta.' });
MP({ e: 'Ingreso y pulsera', r: 'lvq', q: 'enf', h: 'Mar 07:12', tit: 'El equipo ve que ingresó', txt: 'Con la pulsera impresa (con cama o ambulatorio), el turno queda <b>habilitado</b>: quienes tomaron este paciente ven <b>🟡 Ingresó</b> y reciben un aviso. Se puede tomar el turno antes o después del ingreso.', t: 'ingreso', go: 'Toque «Visto»', ver: scrIngreso, ok: 'El equipo sabe que el paciente llegó.' });
MP({ e: 'Paciente en sala', r: 'lvq', q: 'enf', h: 'Mar 07:55', tit: 'El primero que lee el QR abre la planilla', txt: 'Al hacerlo pasar, cualquiera del equipo toca <b>📷 Pulsera</b> en la app (o usa la cámara del teléfono). Con su cuenta del hospital, la app comprueba el sello (si los datos cambiaron, avisa) y muestra la identidad. Al confirmar, se abre para todos. Si no había tomado el paciente, primero toma su lugar. Sin pulsera, la pantalla de sala lo permite con la identidad verificada a mano.', t: 'lvq', go: 'Toque «Abrir para todo el equipo»', ver: scrEscaneo, ok: 'Planilla abierta, con el punto 1 —identidad— confirmado.' });
MP({ e: 'Paciente en sala', r: 'lvq', q: 'anest', h: 'Mar 07:55', tit: 'Se abre sola en todos los teléfonos', txt: 'A quienes están anotados en este paciente y tienen la app abierta, la planilla se les abre sola. Si la tienen cerrada les llega <b>Paciente en sala</b> al teléfono: al tocarlo, se abre. Si falta anotarse alguien, empieza por el momento Equipo, con el botón Avisar.', t: 'todos', go: 'Toque «Escuchar y confirmar»', ver: scrTodos, ok: 'Todo el equipo está en la misma planilla.' });
MP({ e: 'Paciente en sala', r: 'lvq', q: 'enf', h: 'Mar 07:57', tit: 'Una voz, todos escuchan', txt: 'Una persona lee en voz alta y tilda; el resto lo ve en vivo. Cada uno confirma con su botón: no hay casillas repetidas y las firmas son las de siempre. Al confirmar todos, pasa solo al momento siguiente.', t: 'escucha', go: 'Toque «Confirmo»', ver: scrEscucha, ok: 'Entrada confirmada por el equipo.' });
MP({ e: 'Paciente en sala', r: 'lvq', q: 'enf', h: 'Mar 09:40', tit: 'Se cierra y sigue el próximo', txt: 'Al terminar, la pantalla cierra este paciente y dice quién sigue en esa sala y si ya ingresó. Su planilla se abre al leer su pulsera.', t: 'sigue', go: 'Toque «Pasar al siguiente paciente»', ver: scrSigue, fiesta: true, ok: 'Listo para el siguiente paciente.' });

/* Acto · Sin cama: reprogramación con prioridad (3.25) */
const CM = (o) => P(Object.assign({ a: 'cama', lado: pac2HTML }, o));
CM({ e: 'No hay cama', r: 'sin', q: 'adm', h: 'Mar 07:05', tit: 'Ingresa Rosa… y no hay cama', txt: `Martes 20, 07:05. ${REP.pac} llega para su ${REP.proc.toLowerCase()} pero las cuatro salas están completas. Sin cama no se opera: Admisión toca «No hay cama».`, t: 'sincama', go: 'Toque «No hay cama: suspender y reprogramar»', ver: scrSinCama, hacer: (S) => { S.c.sin = true; }, ok: 'Suspendida por falta de cama (1.ª vez). La app ya está buscando lugar.' });
CM({ e: 'La app busca sola', r: 'bus', q: 'jef', h: 'Mar 07:06', tit: 'La app arma la nueva fecha', txt: 'Sin que nadie haga nada, la app recorre los días que la Jefatura abrió y toma el <b>primer turno libre</b> en una sala del mismo tipo, como mínimo <b>48 horas hábiles</b> después del turno suspendido y en un día cuya lista todavía no cerró. El turno nuevo lleva el sello <b>SIN CAMA ×1</b> y va primero en la lista, por encima de todo lo programado. Vale igual para Endoscopía y Obstetricia.', t: 'visto', go: 'Toque «Ver quién tiene que dar el OK»', ver: scrBusca, ok: 'Turno prioritario armado. Ahora, los tres OK.' });
CM({ e: 'Los tres OK', r: 'cir', q: 'cir', h: 'Mar 08:10', tit: 'OK del cirujano', txt: 'Los tres OK se dan <b>en cualquier orden</b>. Al Dr. Sosa le salta un aviso crítico «Falta SU OK» —en el teléfono aunque tenga la app cerrada, y por correo—, y si a las 11 h del día del cierre sigue faltando, otro: «Quedan 2 h». Revisa la fecha y la aprueba: un cartel verde le confirma «OK registrado» y le dice quién falta, y en el camino de la ficha (Cirujano · Admisión · Jefatura · <b>Paciente</b>) su paso queda tildado. Si no le sirve, toca «Pedir otra fecha» y la app pasa a la franja siguiente.', t: 'okcir', go: 'Toque «Dar el OK»', ver: (S) => scrOk(S, 'cir'), hacer: (S) => { S.c.cir = true; }, ok: 'OK del cirujano.' });
CM({ e: 'Los tres OK', r: 'adm', q: 'adm', h: 'Mar 09:20', tit: 'OK de Admisión y Egresos', txt: 'Admisión recibe el aviso también por correo. Lo da desde su sesión, o desde cualquier equipo con el correo y la contraseña del sector; su nombre queda asentado y el OK vale como autorización. Cada OK dado queda tildado ✓ con nombre y hora, sin botón.', t: 'okadm', go: 'Toque «Dar el OK»', ver: (S) => scrOk(S, 'adm'), hacer: (S) => { S.c.adm = true; }, ok: 'OK de Admisión.' });
CM({ e: 'Los tres OK', r: 'jef', q: 'jef', h: 'Mar 09:40', tit: 'OK de la Jefatura', txt: 'La Jefatura también puede darlo desde otro equipo con su credencial. Recién con el tercer OK la app le pregunta a la paciente —antes no le llega nada—: le manda un correo (sin datos de salud) y la fecha aparece en su pase. Si no tiene pase, Admisión la llama y anota «Confirmó por teléfono» o «No puede ese día».', t: 'okjef', go: 'Toque «Dar el OK»', ver: (S) => scrOk(S, 'jef'), hacer: (S) => { S.c.jef = true; }, ok: 'Los tres OK: se le pregunta a Rosa.' });
CM({ id: 'cama-pac', e: 'La paciente responde', r: 'pac', q: 'pac2', h: 'Mar 10:12', tit: 'Rosa responde desde su teléfono', txt: 'Rosa abre su pase (DNI + código del correo) y ve la nueva fecha y un paso nuevo, <b>Vos</b>: «Falta tu OK». El equipo la sigue con «👁 Ver el seguimiento del paciente». Si en 24 h no responde, el aviso del equipo cambia a «llamarla». Elija qué contesta Rosa:', t: ['si', 'no'], go: 'En el teléfono de Rosa, toque «Sí, puedo venir» o «No puedo ese día»', ver: pac2HTML, lado: null, elegir: (t) => { ELEC.camaNo = t === 'no'; }, hacer: (S) => { if (ELEC.camaNo) S.c.no = true; else S.c.pac = true; }, ok: (t) => t === 'si' ? '¡Confirmada sola! Queda en el parte con prioridad.' : 'Rosa no puede ese día: la app busca otro.' });
CM({ si: () => ELEC.camaNo === true, e: 'La paciente responde', r: 'no', q: 'cir', h: 'Mar 10:13', tit: 'Dice que no: otra fecha y los OK a cero', txt: 'La app <b>saltea ese día entero</b> y propone el siguiente turno libre, también a 48 h hábiles como mínimo. La cirugía vuelve a <b>Pendiente</b> y los tres OK vuelven a cero: al Dr. Sosa le salta otra vez «Falta SU OK» y la ve en <b>Mis Solicitudes</b>, en la semana de la nueva fecha. Se repiten los tres OK y la pregunta a Rosa.', t: 'entendido', go: 'Toque «Entendido: se repiten los OK»', ver: scrNoPuede, ok: 'Mientras tanto, corre el reloj de las 13 h.' });

const LLAVE = 'hru_manual_v2';
let cur = 0;
const lista = () => PASOS.filter((p) => !p.si || p.si());
const val = (x, a) => (typeof x === 'function' ? x(a) : x);
const primerDe = (a) => lista().findIndex((p) => p.a === a);
const pasosDe = (a) => lista().filter((p) => p.a === a).length;
function estadoHasta(n) { const S = inicial(), L = lista(); for (let i = 0; i < n; i++) if (L[i].hacer) L[i].hacer(S); return S; }
function leerGuardado() { try { return JSON.parse(localStorage.getItem(LLAVE) || 'null'); } catch (e) { return null; } }
// En la portada no se guarda: así «Seguir donde quedé» no se pierde al volver a ella.
function guardar() { if (cur === 0) return; try { localStorage.setItem(LLAVE, JSON.stringify({ cur, elec: ELEC })); } catch (e) {} }

const RIEL_MAPA = [['al', '06:30'], ['pin', 'Mapa'], ['env', 'Enviar'], ['rec', 'Recibido'], ['ing', 'Cama roja'], ['pul', 'Pulsera'], ['lvq', 'En sala']];
const RIEL_CAMA = () => [['sin', 'Sin cama'], ['bus', 'Nueva fecha'], ['cir', 'OK cirujano'], ['adm', 'OK Admisión'], ['jef', 'OK Jefatura'], ['pac', 'Paciente'],
  ...(ELEC.camaNo === true ? [['no', 'Otra fecha']] : [['fin', 'Prioridad'], ['parte', 'Parte']]), ['cad', '13 h'], ['rep', 'Reprogramar'], ['mapa', 'Recorrido']];
const RIEL_EQD = [['20h', '20:00 aviso'], ['ver', 'Propuesta'], ['camb', 'Cambiar'], ['vivo', 'En vivo'], ['conf', 'Confirmar'], ['sala', 'Llegué'], ['dia', 'Reemplazo']];
const RIEL_PROG = [['prog', 'Programada'], ['adm', 'Admisión'], ['jef', 'Jefatura'], ['cama', 'Cama'], ['eq', 'Equipo'], ['pa', 'Parte pre-anest.'], ['ent', 'LVQ Entrada'], ['rec1', 'Gasas'], ['pau', 'Pausa'], ['ini', 'Cirugía'], ['rec2', 'Recuento final'], ['sal', 'LVQ Salida'], ['rec', 'Recuperación'], ['lin', 'Mi línea'], ['fin', 'QR cerrado']];
function rielHTML(st) {
  let est;
  if (st.a === 'prog') est = RIEL_PROG;
  else if (st.a === 'endo') est = [['prog', 'Programada'], ['adm', 'Admisión'], ['pul', 'Pulsera'], ['eq', 'Equipo'], ['lvq', 'QR'], ['ent', 'Entrada'], ['pau', 'Pausa'], ['sal', 'Salida'], ['rec', 'Recuperación']];
  else if (st.a === 'cama') est = RIEL_CAMA();
  else if (st.a === 'mapa') est = RIEL_MAPA;
  else if (st.a === 'eqd') est = RIEL_EQD;
  else if (st.a === 'urg') est = fuera()
    ? [['urg', 'Urgencia'], ['eq', 'Guardia'], ['ini', 'LVQ + cirugía'], ['sal', 'Salida'], ['adm', 'Admisión'], ['jef', 'Jefatura'], ['fin', 'Finalizada']]
    : [['urg', 'Urgencia'], ['adm', 'Admisión'], ['jef', 'Jefatura'], ['eq', 'Equipo'], ['ini', 'LVQ + cirugía'], ['sal', 'Salida'], ['fin', 'Finalizada']];
  else return '';
  let idx = est.findIndex(([k]) => k === st.r);
  if (st.r === 'fin+' || (st.a === 'urg' && st.r === 'fin')) idx = est.length;
  return `<div class="riel" aria-label="En qué está la cirugía">${est.map(([k, n], i) => {
    const dif = st.a === 'urg' && fuera() && ['adm', 'jef'].includes(k) && i > idx;
    const c = i < idx ? 'ok' : i === idx ? 'act' : dif ? 'dif' : '';
    return `<div class="est ${c}"><i>${c === 'ok' ? '✓' : dif ? '⏸' : i + 1}</i>${n}</div>`;
  }).join('')}</div>`;
}
function devHTML(k, hora, html, lado, qf) {
  return `<div class="dev${lado ? ' lado' : ''}" style="--k:${R[k].c}"><div class="dev-in">
    <div class="dev-st"><span>${hora || ''}</span><span class="isla"></span><span>5G ▮▮▮</span></div>
    <div class="dev-who">${av(k)}<div><b>${R[k].n}</b><small>${qf || R[k].f}</small></div><span class="app">${k.startsWith('pac') ? 'Portal paciente' : 'HRU'}</span></div>
    <div class="scr">${html}</div></div></div>`;
}
function mapaHTML(L) {
  const st = L[cur];
  return `<h3>Recorrido</h3>${ACTOS.map((a, ai) => {
    const pasos = L.map((p, i) => ({ p, i })).filter((x) => x.p.a === a.k);
    if (!pasos.length) return '';
    const escs = [];
    pasos.forEach(({ p, i }) => { const u = escs[escs.length - 1]; if (u && u.e === p.e) u.hasta = i; else escs.push({ e: p.e, desde: i, hasta: i }); });
    const hechos = pasos.filter((x) => x.i < cur).length;
    return `<div class="acto${st.a === a.k ? ' on' : ''}"><button class="acto-h" data-t="ir:${pasos[0].i}"><i>${a.i}</i>${ai + 1} · ${a.n}<small>${hechos}/${pasos.length}</small></button>
      <ul class="escs">${escs.map((s) => { const c = cur > s.hasta ? 'ok' : cur >= s.desde ? 'act' : ''; return `<li><button class="${c}" data-t="ir:${s.desde}"><span>${c === 'ok' ? '✓' : ''}</span>${s.e}</button></li>`; }).join('')}</ul></div>`;
  }).join('')}<button class="tb" style="width:100%;margin-top:6px" data-t="ir:0">🎬 Portada</button>`;
}
function render() {
  const L = lista();
  cur = Math.max(0, Math.min(cur, L.length - 1));
  const st = L[cur], S = estadoHasta(cur);
  $('#barra').style.width = (cur / (L.length - 1) * 100) + '%';
  $('#mapa').innerHTML = mapaHTML(L);
  if (st.full) {
    $('#escena').innerHTML = st.full();
  } else {
    const actoN = ACTOS.findIndex((a) => a.k === st.a);
    const enActo = L.filter((p) => p.a === st.a), nEn = enActo.indexOf(st) + 1;
    $('#escena').innerHTML = `<div class="esc-grid"><div class="col-rel"><section class="relato" style="--k:${R[st.q].c}">
        <div class="rel-top"><span class="chip">${ACTOS[actoN].i} Acto ${actoN + 1} · ${ACTOS[actoN].n}</span><span>${st.e}</span><span>· paso ${nEn} de ${enActo.length}</span></div>
        <h1>${val(st.tit)}</h1>
        <div class="quien">${av(st.q)}<span>${R[st.q].n} <small>· ${st.qf || R[st.q].f}</small></span></div>
        <p>${val(st.txt)}</p>
        <div class="go"><span class="dedo">👆</span><span>${val(st.go)}</span></div>
        <div class="nav"><button class="tb" data-t="ant">← Anterior</button><button class="tb foco-btn" data-t="foco">👇 Ir a lo marcado</button><span class="esp"></span><span class="atajos">Teclas ← →</span><button class="tb" data-t="sig">Saltar paso →</button></div>
      </section></div><div class="col-esc">
      ${rielHTML(st)}
      <div class="escenario">${devHTML(st.q, val(st.h), st.ver(S), false, st.qf)}${st.pac ? devHTML('pac', val(st.h), pacHTML(S), true) : ''}${st.tab ? devHTML('tab', val(st.h), tabHTML(S), true) : ''}${st.lado ? devHTML(st.ladoQ || 'pac2', val(st.h), st.lado(S), true) : ''}</div></div></div>`;
    [].concat(st.t || []).forEach((t) => { const el = document.querySelector(`.escenario [data-t="${t}"]`); if (el) el.classList.add('foco'); });
    // Dentro de cada pantalla, que lo marcado quede a la vista.
    document.querySelectorAll('.escenario .foco').forEach((el) => { const s = el.closest('.scr'); if (s && s.scrollHeight > s.clientHeight) s.scrollTop = Math.max(0, el.offsetTop - s.clientHeight / 2); });
  }
  if (st.fiesta && st.full) festejo();
  guardar();
}
function ir(n) {
  cur = n; render();
  const f = $('.escenario .foco');
  if (innerWidth >= 1100 && f) {
    const r = f.getBoundingClientRect();
    if (r.top < 80 || r.bottom > innerHeight - 20) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const y = $('#escena').getBoundingClientRect().top + scrollY - 80;
  if (scrollY > y + 10) scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
}
function irAFoco() { const el = $('.escenario .foco'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function cumplir(st, t) {
  const salto = st.elegir ? st.elegir(t) : null;
  const msg = val(st.ok, t);
  if (st.fiesta) festejo();
  if (msg) toast(msg, 'ok');
  ir(salto ? lista().findIndex((p) => p.id === salto) : cur + 1);
}

let tt;
function toast(txt, tipo) {
  const t = $('#toast');
  t.className = 'toast ' + (tipo || 'ok');
  t.innerHTML = `<i>${tipo === 'info' ? 'ℹ️' : '✅'}</i><span>${txt}</span>`;
  requestAnimationFrame(() => t.classList.add('on'));
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), tipo === 'info' ? 5200 : 3800);
}
function festejo() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#f59e0b', '#2563eb', '#db2777', '#0d9488', '#7c3aed', '#16a34a'];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('i');
    p.className = 'papel';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    p.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3800);
  }
}
function mapa(abrir) { $('#mapa').classList.toggle('abierto', abrir); $('#velo').classList.toggle('abierto', abrir); }
function tema() {
  const r = document.documentElement;
  const oscuro = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = oscuro ? 'light' : 'dark';
  try { localStorage.setItem('hru_manual_tema', r.dataset.theme); } catch (e) {}
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-t]');
  if (!el || el.disabled) return;
  const t = el.dataset.t;
  if (t === 'volver') return volverApp();
  if (t === 'tema') return tema();
  if (t === 'mapa') return mapa(!$('#mapa').classList.contains('abierto'));
  if (t.startsWith('ir:')) { mapa(false); return ir(Number(t.slice(3))); }
  if (t === 'ant') return ir(cur - 1);
  if (t === 'sig') return ir(cur + 1);
  if (t === 'foco') return irAFoco();
  if (t === 'reinicio') { ELEC = {}; try { localStorage.removeItem(LLAVE); } catch (er) {} return ir(0); }
  const st = lista()[cur];
  if ([].concat(st.t || []).includes(t)) return cumplir(st, t);
  if (t === 'info') return toast(el.dataset.info, 'info');
  // Tocó otra cosa dentro de una pantalla: se le recuerda qué tocar.
  const f = $('.escenario .foco');
  if (f) { f.classList.add('sacude'); setTimeout(() => f.classList.remove('sacude'), 450); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') ir(cur + 1);
  if (e.key === 'ArrowLeft') ir(cur - 1);
  if (e.key === 'Escape') mapa(false);
});

/* Arranque: el tema elegido y lo que eligió en la urgencia. Siempre se empieza

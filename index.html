<script>
/* EL MANUAL INTERACTIVO (21-10-2026): manual-interactivo.html abre esta misma
   app con ?local&manual, con los datos de ejemplo. Todo lo que guarda va a
   llaves aparte ("bhc.manual.…"): practicar en el manual no toca la sesión
   ni las preferencias de la app de verdad en ese teléfono. */
if (/[?&]local\b/.test(location.search) && /[?&]manual\b/.test(location.search)) (function(){
  const P = Storage.prototype, g = P.getItem, s = P.setItem, r = P.removeItem;
  const k = x => /^bhc\./.test(x) && !/^bhc\.manual\./.test(x) ? 'bhc.manual.' + x.slice(4) : x;
  P.getItem = function(x){ return g.call(this, k(String(x))); };
  P.setItem = function(x, v){ return s.call(this, k(String(x)), v); };
  P.removeItem = function(x){ return r.call(this, k(String(x))); };
})();
</script>

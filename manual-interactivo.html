<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3c47">
<title>Manual de uso interactivo · Barrio Bahía Cauquén</title>
<meta name="description" content="Manual de uso interactivo de la app del Barrio Bahía Cauquén: la app de verdad, con datos de ejemplo, y una guía que marca qué tocar en cada función.">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  MANUAL DE USO INTERACTIVO (pedido de Claudio, 21-10-2026)
  "Igual al de la app de quirófanos, con acceso desde la app debajo del nombre
  del barrio y del vecino; que se abra aparte, con un botón para regresar, el
  menú desplegable a la izquierda para saltar de función en función y el 100 %
  de la interactividad de la app."
  · En el medio está LA APP DE VERDAD (index.html?local&manual), con los datos
    de ejemplo de la prueba: todo se puede tocar y funciona igual. No se
    conecta a la base del barrio y guarda aparte (llaves "bhc.manual.…"), así
    que practicar acá no toca nada real ni la sesión de la app.
  · A la izquierda, las funciones por perfil (vecinos, garita, Administración,
    hotel, supervisión). Al elegir una, el manual entra con la cuenta que
    corresponde, abre la pantalla y la guía marca qué tocar: el botón titila,
    lo demás se oscurece. Se avanza tocando en la app o con "Hacelo por mí".
  · Sin "películas" automáticas: la guía espera a la persona (como el de HRU).
  · Cada paso busca el botón en la pantalla; si no está, lo dice y deja seguir.
-->
<style>
:root{
  --bg:#eef3f2; --surf:#ffffff; --surf-2:#f5f8f7; --surf-3:#e6eeec;
  --ink:#0f1f1e; --ink-2:#3d4f4d; --muted:#667775; --line:#dce5e3; --line-2:#c9d6d3;
  --brand:#0d6b66; --brand-2:#14968c; --brand-soft:#d8eeea; --deep:#0b3c47;
  --accent:#7445c0; --accent-soft:#eee6fa; --ok:#1b8f5a; --ok-soft:#dcf3e7; --warn:#b7790a; --warn-soft:#fcf0d2;
  --danger:#d33a3a; --sky:#2b6fb3; --sky-soft:#e1edf9; --wood:#b85f24;
  --marco:#15202a; --sombra:0 24px 60px rgba(11,60,71,.22);
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1315; --surf:#111c1f; --surf-2:#152326; --surf-3:#1b2c30;
    --ink:#e6eeec; --ink-2:#b4c3c0; --muted:#83979a; --line:#20313a; --line-2:#2b3f45;
    --brand:#3cbfb2; --brand-2:#59d4c6; --brand-soft:#123936; --deep:#0b3c47;
    --accent:#b18cf0; --accent-soft:#2a2040; --ok:#4fd08f; --ok-soft:#133526; --warn:#f0b54a; --warn-soft:#3a2c10;
    --danger:#f07171; --sky:#7ab3ee; --sky-soft:#142a40; --wood:#e89a63; --marco:#000; --sombra:0 24px 60px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1315; --surf:#111c1f; --surf-2:#152326; --surf-3:#1b2c30;
  --ink:#e6eeec; --ink-2:#b4c3c0; --muted:#83979a; --line:#20313a; --line-2:#2b3f45;
  --brand:#3cbfb2; --brand-2:#59d4c6; --brand-soft:#123936; --deep:#0b3c47;
  --accent:#b18cf0; --accent-soft:#2a2040; --ok:#4fd08f; --ok-soft:#133526; --warn:#f0b54a; --warn-soft:#3a2c10;
  --danger:#f07171; --sky:#7ab3ee; --sky-soft:#142a40; --wood:#e89a63; --marco:#000; --sombra:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- barra de arriba ---------- */
.barra{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff;
  background:linear-gradient(110deg,var(--deep),#0d6b66 55%,#5b3ea8);box-shadow:0 4px 18px rgba(11,60,71,.25);position:relative;z-index:20}
.barra img{width:38px;height:38px;border-radius:50%;background:#fff;flex:none}
.barra .tit{flex:1;min-width:0;line-height:1.15}
.barra .tit b{display:block;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .tit small{display:block;font-size:11.5px;opacity:.8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:99px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:13px;white-space:nowrap}
.bb:hover{background:rgba(255,255,255,.22)}
.bb.volver{background:#fff;color:var(--deep);border-color:#fff}
.bb svg{width:17px;height:17px}
.bb-menu{display:none}
/* ---------- tres columnas ---------- */
.lienzo{display:grid;grid-template-columns:300px 1fr 360px;height:calc(100% - 58px)}
/* el menú desplegable */
.menu{background:var(--surf);border-right:1px solid var(--line);overflow:auto;padding:12px 10px 30px}
.buscar{position:sticky;top:-12px;margin:-12px -10px 8px;padding:12px 10px 8px;background:var(--surf);z-index:1}
.buscar input{width:100%;height:40px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surf-2);color:var(--ink);font:inherit;font-size:14px;padding:0 12px}
.buscar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.avance{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;margin:8px 2px 0}
.avance i{flex:1;height:6px;border-radius:99px;background:var(--surf-3);overflow:hidden}
.avance i b{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .4s}
.grupo{margin-top:6px;border-radius:14px}
.grupo>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:12px;cursor:pointer;font-weight:800;font-size:14px}
.grupo>summary::-webkit-details-marker{display:none}
.grupo>summary:hover{background:var(--surf-2)}
.grupo>summary .gi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--gc-soft,var(--brand-soft));flex:none}
.grupo>summary .gn{flex:1}
.grupo>summary small{font-size:11px;color:var(--muted);font-weight:700}
.grupo>summary .fl{transition:transform .2s;color:var(--muted)}
.grupo[open]>summary .fl{transform:rotate(90deg)}
.lecc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px 7px 14px;margin:1px 0;border-radius:10px;font-size:13.5px;color:var(--ink-2);font-weight:600;position:relative}
.lecc:hover{background:var(--surf-2);color:var(--ink)}
.lecc .chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.lecc.hecha .chk{background:var(--ok);border-color:var(--ok)}
.lecc.on{background:var(--brand-soft);color:var(--ink);font-weight:800}
.lecc.on::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--brand)}
.menu .pie{margin-top:16px;padding:10px;border-radius:12px;background:var(--surf-2);font-size:12px;color:var(--muted);line-height:1.45}
.menu .pie button{margin-top:8px;border:1.5px solid var(--line-2);background:var(--surf);border-radius:10px;padding:6px 10px;font-weight:800;font-size:12px}
/* el teléfono con la app */
.escena{position:relative;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 0%,color-mix(in srgb,var(--brand) 14%,transparent),transparent),var(--bg)}
.escena .vista{position:absolute;top:12px;right:12px;display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:3px;z-index:2}
.escena .vista button{border:0;background:none;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--muted)}
.escena .vista button.on{background:var(--brand);color:#fff}
.tel{position:relative;width:min(400px,100%);height:min(820px,100%);border-radius:44px;background:var(--marco);padding:12px;box-shadow:var(--sombra)}
.tel::before{content:"";position:absolute;top:18px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:99px;background:#000;z-index:2;opacity:.9}
.tel iframe{width:100%;height:100%;border:0;border-radius:34px;background:var(--surf);display:block}
.escena.compu .tel{width:100%;height:100%;border-radius:16px;padding:6px}
.escena.compu .tel::before{display:none}
.escena.compu .tel iframe{border-radius:11px}
.cargando{position:absolute;inset:12px;border-radius:34px;display:grid;place-content:center;text-align:center;gap:10px;background:var(--surf);color:var(--muted);font-weight:700;z-index:1;transition:opacity .3s}
.cargando.fuera{opacity:0;pointer-events:none}
.cargando i{width:36px;height:36px;margin:0 auto;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* la guía */
.guia{background:var(--surf);border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.g-cab{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.g-cab .quien{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gc,var(--brand));background:var(--gc-soft,var(--brand-soft));padding:4px 10px;border-radius:99px}
.g-cab h1{font-size:21px;line-height:1.2;letter-spacing:-.4px;margin:10px 0 4px}
.g-cab p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.puntos{display:flex;gap:5px;margin-top:12px}
.puntos i{flex:1;height:5px;border-radius:99px;background:var(--surf-3);transition:background .3s}
.puntos i.hecho{background:var(--ok)}.puntos i.on{background:var(--brand)}
.g-paso{padding:16px 18px;flex:1;overflow:auto;min-height:0}
.g-paso .np{font-size:12px;font-weight:800;color:var(--muted)}
.g-paso h2{font-size:17px;margin:4px 0 8px;letter-spacing:-.2px}
.g-paso .x{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.g-paso .x b{color:var(--ink)}
.toca{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 12px;border-radius:14px;background:linear-gradient(100deg,#fff4c7,#ffe48a);color:#5a4300;font-weight:800;font-size:13.5px;animation:toca 1.6s ease-in-out infinite}
.toca span{font-size:22px;animation:dedo 1s ease-in-out infinite}
@keyframes toca{50%{box-shadow:0 0 0 6px rgba(255,207,51,.25)}}
@keyframes dedo{50%{transform:translateY(-3px)}}
.toca.mirar{background:var(--sky-soft);color:var(--sky);animation:none}.toca.mirar span{animation:none}
.toca.listo{background:var(--ok-soft);color:var(--ok);animation:none}.toca.listo span{animation:none}
.nohay{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:700;line-height:1.45}
.g-btns{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.gb{flex:1;min-width:0;height:44px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surf-2);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.gb:disabled{opacity:.4;cursor:default}
.gb.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.gb.yo{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}
.gb.late{animation:late 1.2s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 25%,transparent)}}
.fin{text-align:center;padding:24px 18px}
.fin .conf{font-size:44px;animation:salta .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes salta{from{transform:scale(.3);opacity:0}}
.fin h2{margin:8px 0 6px}
.bienv{padding:20px 18px;overflow:auto}
.bienv h1{font-size:22px;letter-spacing:-.4px;margin:0 0 8px}
.bienv p{color:var(--ink-2);line-height:1.55;font-size:14px}
.bienv .tarjetas{display:grid;gap:8px;margin-top:14px}
.bienv .tj{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf-2);text-align:left;font-weight:800;font-size:14px}
.bienv .tj:hover{border-color:var(--brand);transform:translateY(-1px)}
.bienv .tj span{font-size:22px}
.bienv .tj small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.seguro{margin-top:14px;display:flex;gap:8px;padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:12.5px;font-weight:700;line-height:1.45}
.velo-menu{display:none}
/* ---------- tablet: el menú se abre con un botón ---------- */
@media (max-width:1180px){
  .lienzo{grid-template-columns:1fr 340px}
  .bb-menu{display:inline-flex}
  .menu{position:fixed;left:0;top:58px;bottom:0;width:min(320px,88vw);z-index:30;transform:translateX(-105%);transition:transform .25s;box-shadow:12px 0 40px rgba(0,0,0,.2)}
  body.menu-abierto .menu{transform:none}
  body.menu-abierto .velo-menu{display:block;position:fixed;inset:58px 0 0 0;background:rgba(5,15,20,.35);z-index:25}
}
/* ---------- celular: la app ocupa todo y la guía va abajo, plegable ---------- */
@media (max-width:760px){
  .barra{height:54px;padding:0 10px;gap:8px}
  .barra img{width:32px;height:32px}
  .barra .tit b{font-size:14.5px}
  .barra .tit small{display:none}
  .bb{height:36px;padding:0 10px;font-size:12.5px}
  .bb .t-larga{display:none}
  .lienzo{display:block;height:calc(100% - 54px);position:relative}
  .menu{top:54px}
  body.menu-abierto .velo-menu{inset:54px 0 0 0}
  .escena{position:absolute;inset:0 0 var(--gh,236px) 0;padding:0}
  .escena .vista{display:none}
  .tel{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .tel::before{display:none}
  .tel iframe{border-radius:0}
  .cargando{inset:0;border-radius:0}
  .guia{position:absolute;left:0;right:0;bottom:0;height:var(--gh,236px);border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:10;transition:height .25s}
  body.guia-grande{--gh:62%}
  .g-cab{padding:10px 14px 8px;position:relative}
  .g-cab::before{content:"";position:absolute;top:5px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:9px;background:var(--line-2)}
  .g-cab h1{font-size:16px;margin:6px 0 0}
  .g-cab p{display:none}
  body.guia-grande .g-cab p{display:block}
  .puntos{margin-top:7px}
  .g-paso{padding:8px 14px}
  .g-paso h2{font-size:15px;margin:2px 0 4px}
  .g-paso .x{font-size:13.5px;line-height:1.45}
  .toca{margin-top:8px;padding:8px 10px;font-size:12.5px}
  .g-btns{padding:8px 14px calc(10px + env(safe-area-inset-bottom));gap:6px}
  .gb{height:40px;font-size:12.5px}
  .bienv{padding:12px 14px}.bienv h1{font-size:17px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="barra">
  <button class="bb bb-menu" data-t="menu" aria-label="Abrir el menú de funciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="t-larga">Funciones</span></button>
  <img src="icons/logo.png" alt="">
  <div class="tit"><b>Manual de uso interactivo</b><small>Barrio Bahía Cauquén · la app de verdad, con datos de ejemplo</small></div>
  <button class="bb" data-t="cero" title="Borra lo que practicaste y vuelve a los datos de ejemplo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="t-larga">Empezar de cero</span></button>
  <button class="bb volver" data-t="volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Regresar<span class="t-larga">&nbsp;a la app</span></button>
</header>
<div class="lienzo">
  <nav class="menu" id="menu" aria-label="Funciones de la app"></nav>
  <div class="velo-menu" data-t="menu"></div>
  <main class="escena" id="escena">
    <div class="vista" role="group" aria-label="Cómo se ve"><button class="on" data-t="vista:tel">📱 Teléfono</button><button data-t="vista:compu">💻 Computadora</button></div>
    <div class="tel"><div class="cargando" id="cargando"><i></i>Abriendo la app de práctica…</div>
      <iframe id="app" title="La app del barrio, en modo práctica" src="about:blank"></iframe></div>
  </main>
  <aside class="guia" id="guia" aria-live="polite"></aside>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const dormir = ms => new Promise(r => setTimeout(r, ms));
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const params = new URLSearchParams(location.search);
const VERSION = params.get('v') || '';

/* =========================================================
   LAS FUNCIONES, POR PERFIL
   Cada lección: quién entra (q), en qué modo (m), qué pantalla abre (ir) y
   los pasos. Un paso tiene título (t), texto (x), el botón que se marca
   (s, un selector de la app) y qué se hace:
     · h: 'tocar'    → se avanza al tocarlo en la app (o con "Hacelo por mí")
     · h: 'escribir' → v es el texto de ejemplo para "Hacelo por mí"
     · h: 'elegir'   → v es la opción de una lista
     · sin h         → solo mirar: se avanza con "Siguiente"
   "ENVIAR:<form>" es el botón de enviar de ese formulario.
   QUIÉN VE CADA FUNCIÓN (Claudio, 21-10-2026): como el manual usa solo datos
   de ejemplo, los vecinos, la garita y la Administración ven TODAS. El hotel
   y la supervisión ven "Para empezar", lo suyo y lo que hacen con la garita
   (ven: [...]), en un grupo "Con la garita".
   ========================================================= */
const G = [
  { id:'empezar', n:'Para empezar', i:'✨', c:'var(--brand)', cs:'var(--brand-soft)', d:'Cómo es la app' },
  { id:'vecino', con:'Con los vecinos', n:'Vecinos', i:'🏡', c:'var(--ok)', cs:'var(--ok-soft)', d:'Tu casa, tus visitas y el barrio' },
  { id:'garita', con:'Con la garita', n:'Garita', i:'🛡️', c:'var(--sky)', cs:'var(--sky-soft)', d:'El turno, los ingresos y la ronda' },
  { id:'admin', con:'Con la Administración', n:'Administración', i:'🗂️', c:'var(--accent)', cs:'var(--accent-soft)', d:'La gestión del barrio' },
  { id:'hotel', con:'Con el hotel', n:'Hotel Los Cauquenes', i:'🏨', c:'var(--wood)', cs:'#fbe9dc', d:'Vans, huéspedes y empleados' },
  { id:'supervision', con:'Con la supervisión', n:'Supervisión', i:'👁️', c:'#0b3c47', cs:'#dbe9ec', d:'Mirar la garita en vivo' },
];
const PERFILES = ['vecino', 'garita', 'admin', 'hotel', 'supervision'];
const VE = PERFILES.includes(params.get('perfil')) ? params.get('perfil') : 'vecino';
const VEN_TODO = ['vecino', 'garita', 'admin'].includes(VE);
const puedeVer = x => VEN_TODO || x.g === 'empezar' || x.g === VE || ((x.ven || []).includes(VE) && x.g === 'garita');
/* Primero "Para empezar", después lo propio y al final lo compartido. */
const gruposEnOrden = () => [...G].sort((a, b) => (a.id === 'empezar' ? 0 : a.id === VE ? 1 : 2) - (b.id === 'empezar' ? 0 : b.id === VE ? 1 : 2));

    guia.innerHTML = `${cab}<div class="fin"><div class="conf">🎉</div><h2>¡Listo!</h2><p class="x" style="color:var(--ink-2)">Ya sabés <b>${esc(lec.t.toLowerCase())}</b>. Podés seguir tocando la app: todo funciona.</p></div>
      <div class="g-btns"><button class="gb" data-t="otra">↺ Otra vez</button>${sig ? `<button class="gb pri late" data-t="lec:${sig.id}">Siguiente: ${esc(sig.t)} →</button>` : ''}</div>`;
    return; }
  const s = lec.p[ESTADO.i], accion = s.h === 'tocar' ? (ESTADO.hechoPaso ? ['listo', '✅', '¡Bien!'] : ['', '👆', 'Tocá en la app lo que titila'])
    : s.h === 'escribir' ? (ESTADO.hechoPaso ? ['listo', '✅', 'Listo: tocá Siguiente'] : ['', '⌨️', 'Escribí en la casilla que titila']) : s.h === 'elegir' ? (ESTADO.hechoPaso ? ['listo', '✅', 'Listo: tocá Siguiente'] : ['', '👆', 'Elegí en la lista que titila']) : ['mirar', '👀', 'Mirá en la app y tocá Siguiente'];
  guia.innerHTML = `${cab}<div class="g-paso"><span class="np">Paso ${ESTADO.i + 1} de ${n}</span><h2>${esc(s.t)}</h2><div class="x">${s.x}</div>
      <div class="toca ${accion[0]}"><span>${accion[1]}</span>${cargando ? 'Abriendo la app…' : accion[2]}</div>
      <div class="nohay" id="nohay" hidden>No encuentro ese botón en la pantalla (puede que la app esté en otra parte). Tocá <b>"Hacelo por mí"</b>, <b>"Siguiente"</b> o empezá la función otra vez.</div></div>
    <div class="g-btns"><button class="gb" data-t="ant" ${ESTADO.i ? '' : 'disabled'}>← Atrás</button>
      ${s.h ? `<button class="gb yo" data-t="yo">🪄 Hacelo por mí</button>` : ''}
      <button class="gb pri ${!s.h || ESTADO.hechoPaso ? 'late' : ''}" data-t="sig">${ESTADO.i === n - 1 ? 'Terminar ✓' : 'Siguiente →'}</button></div>`;
  ultimoEl = undefined;
}

/* ---------- Regresar a la app ---------- */
function volverApp(){
  const planB = () => { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin){ history.back(); return; } location.href = './'; };
  try {
    if (window.opener && !window.opener.closed){ try { window.opener.focus(); } catch(e){} window.close(); setTimeout(() => { if (!window.closed) planB(); }, 400); return; }
  } catch(e){}
  planB();
}
async function deCero(){
  if (!confirm('¿Empezar de cero? Se borra lo que practicaste y la app vuelve a los datos de ejemplo.')) return;
  try { Object.keys(localStorage).filter(k => k.startsWith('bhc.manual.')).forEach(k => localStorage.removeItem(k)); } catch(e){}
  ESTADO.hechas.clear(); guardarHechas();
  cargarApp(); await esperarApp(); if (ESTADO.lec) empezar(ESTADO.lec.id); else pintarMenu();
}

/* ---------- toques ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  const t = b.dataset.t;
  if (t === 'volver') return volverApp();
  if (t === 'menu') return document.body.classList.toggle('menu-abierto');
  if (t === 'cero') return deCero();
  if (t === 'sig') return siguiente();
  if (t === 'ant') return anterior();
  if (t === 'yo') return hacerPorMi();
  if (t === 'otra') return empezar(ESTADO.lec.id);
  if (t === 'guia-grande') return matchMedia('(max-width:760px)').matches && document.body.classList.toggle('guia-grande');
  if (t.startsWith('lec:')) return empezar(t.slice(4));
  if (t.startsWith('vista:')){ $('#escena').classList.toggle('compu', t === 'vista:compu'); document.querySelectorAll('.vista button').forEach(x => x.classList.toggle('on', x === b)); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.grupo')) ESTADO.abierto[d.dataset.g] = d.open; }, true);
document.addEventListener('input', e => { if (e.target.id === 'buscar') pintarMenu(); });
frame.addEventListener('load', () => { ultimoEl = undefined; esperarApp(); });
setInterval(seguirFoco, 200);

cargarApp(); pintarMenu(); pintarGuia();
{ const h = location.hash.slice(1); if (h && visibles().some(x => x.id === h)) empezar(h); }

</script>

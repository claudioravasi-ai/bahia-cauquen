<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pago · Barrio Bahía Cauquén</title>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<!--
  VUELTA DE MERCADO PAGO (26-09-2026)
  Mercado Pago trae acá al vecino cuando termina de pagar (back_url).
  Esta página:
    1. muestra el resultado (aprobado, pendiente o rechazado);
    2. le avisa a la app del barrio, que quedó abierta en la otra ventana
       (BroadcastChannel, mismo sitio), y espera que conteste "recibido";
    3. a los 3 segundos se cierra sola. Si no la puede cerrar (el
       navegador no lo permite) o la app no estaba abierta, lleva a la app
       con el número de operación, y la app lo verifica con Mercado Pago.
  No se le cree nada a lo que dice la dirección: quien acredita el pago es
  la app, preguntándole a Mercado Pago (a través del Apps Script).
-->
<style>
  :root{--bg:#f2f4f3;--card:#fff;--ink:#0f1f1e;--muted:#6c7d7a;--ok:#1b8f5a;--warn:#b7790a;--bad:#d33a3a;--brand:#0d6b66}
  @media (prefers-color-scheme:dark){:root{--bg:#0a1315;--card:#111c1f;--ink:#e6eeec;--muted:#83979a;--ok:#4fd08f;--warn:#f1bd4d;--bad:#f07171;--brand:#3cbfb2}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:420px;background:var(--card);border-radius:26px;padding:28px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
  img{width:74px;height:74px;border-radius:50%;display:block;margin:0 auto 14px}
  .sello{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff;font-size:34px;font-weight:800}
  .ok .sello{background:var(--ok)} .pend .sello{background:var(--warn)} .mal .sello{background:var(--bad)} .nada .sello{background:var(--brand)}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.3px}
  p{margin:0 0 6px;color:var(--muted);font-size:14.5px}
  .cuenta{margin:18px auto 6px;width:54px;height:54px;border-radius:50%;border:3px solid var(--brand);display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--brand)}
  a{display:inline-block;margin-top:14px;color:var(--brand);font-weight:700;text-decoration:none}
  small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main id="caja">
  <img src="icons/logo.png" alt="Barrio Bahía Cauquén">
  <div class="sello" id="sello">✓</div>
  <h1 id="titulo">Volviendo a la app…</h1>
  <p id="texto"></p>
  <div class="cuenta" id="cuenta">3</div>
  <p id="que">Volvés a la app en 3 segundos</p>
  <a id="volver" href="index.html">Volver ahora</a>

  <small id="op"></small>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var id = q.get('payment_id') || q.get('collection_id') || '';
  var st = q.get('status') || q.get('collection_status') || '';
  var ref = q.get('external_reference') || '';
  if (id === 'null') id = '';
  var ok = st === 'approved', pend = ['pending', 'in_process', 'authorized'].indexOf(st) >= 0;
  /* Sin datos de un pago (se abrió la página sola): no hay nada que
     mostrar, se vuelve derecho a la app. */
  var sinDatos = !id && !st;
  var caja = document.getElementById('caja');
  caja.className = sinDatos ? 'nada' : ok ? 'ok' : pend ? 'pend' : 'mal';
  document.getElementById('sello').textContent = sinDatos ? '↩' : ok ? '✓' : pend ? '…' : '!';
  document.getElementById('titulo').textContent = sinDatos ? 'Volviendo a la app del barrio' : ok ? '¡Pago aprobado!' : pend ? 'Pago en proceso' : 'El pago no se completó';
  document.getElementById('texto').textContent = sinDatos ? '' : ok ? 'Mercado Pago aprobó tu pago. La app del barrio lo descuenta de tu saldo y el recibo te llega solo.'
    : pend ? 'Mercado Pago todavía lo está procesando. Cuando se apruebe se acredita solo: no hace falta que hagas nada.'
    : 'No se cobró nada. Podés intentarlo de nuevo desde la app.';
  if (id) document.getElementById('op').textContent = 'Operación de Mercado Pago Nº ' + id;

  /* La dirección de la app (index.html con todas las letras: así anda
     también donde el servidor no completa la carpeta), con lo necesario
     para que la app verifique el pago. */
  var app = 'index.html' + (sinDatos ? '' : '?mp=1' + (id ? '&payment_id=' + encodeURIComponent(id) : '') + (st ? '&status=' + encodeURIComponent(st) : '') + (ref ? '&external_reference=' + encodeURIComponent(ref) : ''));
  document.getElementById('volver').href = app;

  /* Avisarle a la app que quedó abierta en la otra ventana. */
  var recibido = false, canal = null;
  try {
    canal = new BroadcastChannel('bhc-pago');
    canal.onmessage = function(e){ if (e.data && e.data.tipo === 'recibido') recibido = true; };
    canal.postMessage({ tipo:'pago', id:id, estado:st, ref:ref });
    setTimeout(function(){ if (!recibido) try { canal.postMessage({ tipo:'pago', id:id, estado:st, ref:ref }); } catch(e){} }, 1200);
  } catch(e){}

  var n = 3, el = document.getElementById('cuenta'), que = document.getElementById('que');
  var t = setInterval(function(){
    n--; el.textContent = Math.max(n, 0); que.textContent = n > 0 ? 'Volvés a la app en ' + n + (n === 1 ? ' segundo' : ' segundos') : 'Volviendo…';
    if (n > 0) return;
    clearInterval(t);
    if (recibido){
      /* La app ya lo tiene: esta ventana se cierra y queda la app como estaba. */
      try { window.close(); } catch(e){}
      setTimeout(function(){ que.textContent = 'Listo: tu pago ya quedó en la app. Podés cerrar esta pestaña.'; el.style.display = 'none'; }, 400);
    } else {
      /* La app no estaba abierta en otra ventana (pagaste en la misma
         pantalla, o el navegador separó las ventanas): se vuelve a la app. */
      location.replace(app);
    }
  }, 1000);
})();
</script>
</body>
</html>
